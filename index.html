  const h=`<div class="grab"></div><button class="close" data-close>✕</button><div class="ghead" style="--tc:${it.c}"><span class="tic">${it.ic}</span><div><h3>${it.t}</h3><div class="meta">${it.s}</div></div></div>`+TOOLS[TOOL.id].html(TOOL.st);
  if(keep){sh.innerHTML=h;sh.scrollTop=top}else openSheet(h);
  if(TOOLS[TOOL.id].upd)TOOLS[TOOL.id].upd(TOOL.st);
}
const $=id=>document.getElementById(id);
const chips=(key,opts,cur)=>`<div class="tgs">${opts.map(o=>`<button class="tg ${String(cur)===String(o[0])?"on":""}" data-tc="${key}=${o[0]}">${o[1]}</button>`).join("")}</div>`;
const tog=(key,label,on)=>`<button class="tg ${on?"on":""}" data-tc="${key}=!">${label}</button>`;
function goalDurStr(){const g=goal();return g?fmtHMS(raceDur(g)):"1:00:00"}

const TOOLS = {
/* ---- KALKULATOR TEMPA ---- */
pace:{
  init:()=>{const g=goal();return {mode:"t",dist:g?String(g.dist):"10",custom:"",time:g?fmtHMS(raceDur(g)):"55:00",pace:g?fmtPace(racePace(g)):"5:30"}},
  html:st=>`${chips("mode",[["t","Imam ciljni čas"],["p","Imam tempo"]],st.mode)}
   <div class="fl">Razdalja</div>${chips("dist",[["5","5 km"],["10","10 km"],["21.1","21,1"],["42.2","42,2"],["c","Druga"]],st.dist)}
   ${st.dist==="c"?`<input class="inp" style="margin-top:8px" data-ti="custom" inputmode="decimal" placeholder="Razdalja v km, npr. 15" value="${esc(st.custom)}">`:""}
   <div class="fl">${st.mode==="t"?"Čas (h:mm:ss ali mm:ss)":"Tempo (min:s na km)"}</div>
   <input class="inp" data-ti="${st.mode==="t"?"time":"pace"}" inputmode="numeric" value="${esc(st.mode==="t"?st.time:st.pace)}">
   <div id="tres"></div>`,
  upd:st=>{
    const D=st.dist==="c"?parseFloat(String(st.custom).replace(",",".")):parseFloat(st.dist);
    let T=null;
    if(D>0){if(st.mode==="t"){const s=parseTime(st.time);if(s)T=s/60}else{const p=parseTime(st.pace);if(p)T=p/60*D}}
    if(!T){$("tres").innerHTML=`<div class="hint" style="margin-top:12px">Vpiši razdaljo in ${st.mode==="t"?"čas":"tempo"}.</div>`;return}
    const pace=T/D, g=goal();
    const preds=[5,10,15,21.1,42.2].filter(x=>Math.abs(x-D)>0.05).map(x=>[x,T*Math.pow(x/D,1.06)]);
    $("tres").innerHTML=`<div class="rgrid"><div class="rc"><small>Tempo</small><b class="num">${fmtPace(pace)}</b><small>min/km</small></div><div class="rc"><small>Končni čas</small><b class="num">${fmtHMS(T)}</b><small>${comma(Math.round(D*10)/10)} km</small></div><div class="rc"><small>Hitrost</small><b class="num">${comma((60/pace).toFixed(1))}</b><small>km/h</small></div></div>
    <div class="fl">Vmesni časi</div><div class="splits">${(D>25?[5,10,15,20,25,30,35,40]:D>12?[3,6,9,12,15,18]:D>5?[2,4,6,8]:[1,2,3,4]).filter(k=>k<D).map(k=>`<div><b class="num">${fmtHMS(pace*k)}</b>${k} km</div>`).join("")}</div>
    <div class="fl">Napoved za druge razdalje</div><div class="hint" style="margin:-4px 0 8px">Po Riegelovi formuli – velja ob ustrezni pripravi na posamezno razdaljo.</div>
    ${preds.map(([x,t])=>`<div class="prow"><span><b>${DLAB(x)}</b></span><span class="num">${fmtHMS(t)}</span><span class="mut">${fmtPace(t/x)} /km</span>${g&&Math.abs(g.dist-x)<0.05?`<button class="tg on" data-settarget="${Math.round(t*60)}">Nastavi kot cilj</button>`:""}</div>`).join("")}
    ${g&&Math.abs(g.dist-D)<0.05?`<button class="btn pri" style="width:100%;margin-top:14px" data-settarget="${Math.round(T*60)}">Nastavi ${fmtHMS(T)} kot ciljni čas za »${esc(g.name)}«</button>`:""}`;
  }
},
/* ---- PREHRANA ---- */
fuel:{
  init:()=>({time:goalDurStr(),kg:75,cond:"z",br:{}}),
  html:st=>`<div class="row2"><div><div class="fl">Pričakovani čas</div><input class="inp" data-ti="time" inputmode="numeric" value="${esc(st.time)}"></div>
    <div><div class="fl">Telesna teža: <span id="kgv">${st.kg}</span> kg</div><input type="range" min="40" max="120" value="${st.kg}" data-ti="kg"></div></div>
    <div class="fl">Vreme na dan tekme</div>${chips("cond",[["h","Hladno (< 10 °C)"],["z","Zmerno"],["t","Toplo (> 20 °C)"]],st.cond)}
    <div id="fres"></div>
    <div class="fl">Sestavi zajtrk (2–3 h pred startom)</div>
    <div class="note" style="padding:12px"><div class="brhead"><span>Ogljikovi hidrati</span><b class="num" id="brsum">0 g</b></div><div class="brbar"><span id="brfill"></span><i id="brmin"></i><i id="brmax"></i></div><div class="hint" id="brtxt"></div>
    ${FOODS.map((f,i)=>`<div class="food"><div><b>${f[0]}</b><small>${f[1]} g OH</small></div><button class="qb" data-food="${i}:-1">−</button><span class="num" id="fq${i}">${st.br[i]||0}</span><button class="qb" data-food="${i}:1">+</button></div>`).join("")}</div>
    <p class="foot" style="text-align:left;margin-top:8px">Vrednosti so splošna izhodišča za zdrave odrasle. Pri posebnih prehranskih potrebah se posvetuj s strokovnjakom.</p>`,
  upd:st=>{
    const s=parseTime(st.time), kg=+st.kg; $("kgv").textContent=kg;
    if(!s){$("fres").innerHTML=`<div class="hint">Vpiši čas kot h:mm:ss ali mm:ss.</div>`;return}
    const m=s/60;
    let during, gels=[];
    if(m<60) during=`<b>Ne potrebuješ hrane.</b> ${st.cond==="t"?"Ker bo toplo, popij nekaj požirkov vode na okrepčevalnicah.":"Če si žejen, nekaj požirkov vode."}`;
    else if(m<75) during=`<b>Neobvezno:</b> en gel ali nekaj požirkov športnega napitka okoli 40. minute.`;
    else { const gph=m<=150?45:70, every=Math.round(25/gph*60);
      for(let t=45;t<=m-12;t+=every)gels.push(t);
      during=`<b>${gph===45?"30–60":"60–90"} g ogljikovih hidratov na uro</b> – en gel (≈ 25 g) približno vsakih ${every} minut${gph===70?", del lahko nadomesti športni napitek":""}.`; }
    const fl=st.cond==="h"?[300,500]:st.cond==="z"?[400,700]:[600,900];
    const loadTxt = m>90?`<b>2 dni pred tekmo</b> jej več ogljikovih hidratov: približno <b>${Math.round(kg*8)}–${Math.round(kg*10)} g na dan</b> (testenine, riž, kruh, krompir, sadje). Manj vlaknin in maščob.`:m>=60?`<b>Dan pred tekmo</b> dodaj k obrokom nekaj več ogljikovih hidratov – približno ${Math.round(kg*6)}–${Math.round(kg*7)} g na dan.`:`Posebne priprave ni treba. Jej <b>običajno in redno</b>, večerja naj bo znana in ne pretežka.`;
    $("fres").innerHTML=`<div class="fcard"><span>🍝</span><div><b>Pred tekmo</b><p>${loadTxt}</p></div></div>
     <div class="fcard"><span>⚡</span><div><b>Med tekom</b><p>${during}</p>${gels.length?`<div class="gels">${gels.map((t,i)=>`<span><b class="num">${fmtHMS(t)}</b>gel ${i+1}</span>`).join("")}</div><p class="mut">Skupaj ${gels.length} ${gels.length===1?"gel":gels.length===2?"gela":gels.length<5?"geli":"gelov"}. Vzemi ga tik pred okrepčevalnico in zalij z vodo. Preizkusi na dolgih tekih!</p>`:""}</div></div>
     <div class="fcard"><span>💧</span><div><b>Tekočina</b><p>Približno <b>${fl[0]}–${fl[1]} ml na uro</b>${m>=60?` – skupaj ${Math.round(fl[0]*m/60/50)*50}–${Math.round(fl[1]*m/60/50)*50} ml`:""}. Pij po žeji, ne na silo – preveč vode je lahko nevarno.${st.cond==="t"||m>120?" Dodaj elektrolite (sol), ker boš izgubil več znoja.":""}</p></div></div>
     <div class="fcard"><span>🥛</span><div><b>Po tekmi (v 1–2 urah)</b><p>Okoli <b>${Math.round(kg)}–${Math.round(kg*1.2)} g ogljikovih hidratov</b> in <b>20–25 g beljakovin</b> – npr. sendvič s puranom, jogurt s sadjem ali čokoladno mleko.</p></div></div>`;
    const tmin=Math.round(kg*1), tmax=Math.round(kg*2);
    const sum=FOODS.reduce((a,f,i)=>a+f[1]*(st.br[i]||0),0), mx=tmax*1.3;
    $("brsum").textContent=sum+" g";$("brfill").style.width=Math.min(100,sum/mx*100)+"%";
    $("brfill").style.background=sum<tmin?"var(--tempo)":sum<=tmax?"var(--acc)":"var(--fast)";
    $("brmin").style.left=tmin/mx*100+"%";$("brmax").style.left=tmax/mx*100+"%";
    FOODS.forEach((f,i)=>$("fq"+i).textContent=st.br[i]||0);
    $("brtxt").innerHTML=`Cilj: <b>${tmin}–${tmax} g</b> (1–2 g na kg). ${sum===0?"Dodaj živila s tipko +.":sum<tmin?"Še malo – dodaj kaj lahko prebavljivega.":sum<=tmax?"✓ Odlično – zajtrk je ravno prav.":"Preveč za zajtrk pred tekmo – lahko bo težko v želodcu."}${m<60&&sum>0?" Pri krajših tekih zadošča tudi spodnja meja.":""}`;
  }
},
/* ---- OBLAČILA ---- */
clothes:{
  init:()=>({temp:8,wind:false,rain:false,sun:false,type:"easy"}),
  html:st=>`<div class="fl">Temperatura: <span id="tv" class="num" style="font-size:18px;color:var(--tx)">${st.temp} °C</span></div><input type="range" min="-10" max="32" value="${st.temp}" data-ti="temp">
   <div class="fl">Razmere</div><div class="tgs">${tog("wind","💨 Veter",st.wind)}${tog("rain","🌧 Dež",st.rain)}${tog("sun","☀️ Močno sonce",st.sun)}</div>
   <div class="fl">Vrsta teka</div>${chips("type",[["easy","Lahek / dolgi tek"],["race","Tekma ali intervali"]],st.type)}
   <div id="cres"></div>`,
  upd:st=>{
    const t=+st.temp; $("tv").textContent=t+" °C";
    const eff=t+(st.type==="race"?10:7)-(st.wind?3:0)-(st.rain?2:0);
    let head,top,hands,legs,extra=[];
    if(eff>=26){head=st.sun?"Kapa s šiltom, sončna očala":"Nič ali lahek trak";top="Majica brez rokavov ali zelo lahka majica";hands="–";legs="Kratke hlače";extra.push("Pij več in začni počasneje – vročina upočasni vsakogar.")}
    else if(eff>=18){head=st.sun?"Kapa s šiltom":"–";top="Majica s kratkimi rokavi";hands="–";legs="Kratke hlače"}
    else if(eff>=12){head="–";top="Majica s kratkimi rokavi"+(st.wind?" + tanka vetrovka":"");hands="Po želji tanke rokavice";legs="Kratke ali 3/4 hlače"}
    else if(eff>=6){head="Tanek trak za ušesa";top="Tanka majica z dolgimi rokavi";hands="Tanke rokavice";legs="Pajkice ali kratke hlače"}
    else if(eff>=0){head="Kapa ali trak";top="Termo majica z dolgimi rokavi + lahka vetrovka ali brezrokavnik";hands="Rokavice";legs="Dolge tekaške pajkice"}
    else {head="Topla kapa + ovratnik (buff)";top="Termo osnova + srednji sloj + vetrovka";hands="Toplejše rokavice";legs="Zimske pajkice";extra.push("Na poledenelih poteh skrajšaj korak ali teci na krožni progi.")}
    if(st.rain)extra.push("Lahka vodoodbojna jakna in kapa s šiltom – voda ne gre v oči. Namaži predele, ki se drgnejo.");
    if(st.wind)extra.push("V veter teci na začetku, z vetrom v hrbet domov.");
    if(st.sun)extra.push("Zaščitna krema in sončna očala.");
    if(st.type==="race"&&t<12)extra.push("Na startu obleci staro jopo ali vrečo za smeti in jo odvrzi tik pred startom.");
    extra.push("Nogavice iz tehničnega materiala – bombaž povzroča žulje.");
    $("cres").innerHTML=`<div class="effc"><div><small>Obleci se kot za</small><b class="num">${eff} °C</b></div><p>Med tekom se telo segreje za približno ${st.type==="race"?10:7} °C. Na začetku ti mora biti malo hladno.</p></div>
     <div class="outfit">${[["🧢","Glava",head],["👕","Zgornji del",top],["🧤","Roke",hands],["🩳","Spodnji del",legs]].map(o=>`<div><span>${o[0]}</span><small>${o[1]}</small><b>${o[2]}</b></div>`).join("")}</div>
     <div class="note" style="margin-top:10px"><b>Nasveti</b><ul style="padding-left:18px;margin-top:6px">${extra.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  }
},
/* ---- DAN TEKME ---- */
raceday:{
  init:()=>({start:"10:00",travel:30}),
  html:st=>{
    const g=goal(), key="korak_pack_"+(g?g.id:"x"), pk=sget(key,{}), long=g&&g.dist>=15;
    const groups=[["Večer prej",["Štartna številka pripeta na majico","Oblačila pripravljena glede na napoved","Ura in telefon napolnjena","Budilka nastavljena (dve!)","Večerja znana in ne pretežka"]],
      ["V torbi",["Čevlji in nogavice, preizkušeni na treningu","Varnostne zaponke ali pas za številko","Odvržna plast za start","Vazelin proti drgnjenju","Voda za pred startom",...(long?["Geli ali energijski napitek"]:[]),"Suha oblačila in brisača za po teku","Prigrizek za po cilju","Osebni dokument, kartica, ključi"]]];
    const all=[].concat(...groups.map(x=>x[1])), dn=all.filter(x=>pk[x]).length;
    return `<div class="row2"><div><div class="fl">Ura starta</div><input class="inp" type="time" data-ti="start" value="${st.start}"></div>
     <div><div class="fl">Pot do starta: <span id="trv">${st.travel}</span> min</div><input type="range" min="0" max="180" step="5" value="${st.travel}" data-ti="travel"></div></div>
     <div class="fl">Tvoja časovnica</div><div id="rtl"></div>
     <div class="fl" style="display:flex;justify-content:space-between"><span>Seznam za torbo</span><span style="color:var(--acct)">${dn}/${all.length}</span></div>
     <div class="prog" style="margin-top:0"><span style="width:${dn/all.length*100}%"></span></div>
     ${groups.map(gr=>`<div class="ckg"><small>${gr[0]}</small>${gr[1].map(x=>`<button class="cki ${pk[x]?"on":""}" data-pk="${esc(x)}"><i>✓</i>${x}</button>`).join("")}</div>`).join("")}`;
  },
  upd:st=>{
    $("trv").textContent=st.travel;
    const [h,m]=(st.start||"10:00").split(":").map(Number); if(isNaN(h)){$("rtl").innerHTML="";return}
    const S=h*60+m, f=x=>{x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
    const tr=+st.travel, ev=[[S-180-30,"⏰","Budilka","Kozarec vode, kratko razgibavanje."],[S-180,"🥣","Zajtrk","Znana hrana, 1–2 g OH na kg teže."],[S-60-tr,"🚗","Odhod","Oblečen, številka pripeta, torba pripravljena."],[S-60,"📍","Prihod na prizorišče","Garderoba, WC – vrste so dolge."],[S-25,"🔥","Ogrevanje","5 min hoje, 5 min lahkega kasa, nekaj pospeškov."],[S-12,"🚦","V štartni boks","Postavi se k tekačem s podobnim tempom."],[S,"🏁","START","Prvi kilometer naj bo najpočasnejši!"]];
    ev.sort((a,b)=>a[0]-b[0]);
    $("rtl").innerHTML=`<div class="rtl">${ev.map(e=>`<div class="rte ${e[2]==="START"?"st":""}"><b class="num">${f(e[0])}</b><span>${e[1]}</span><div><b>${e[2]}</b><small>${e[3]}</small></div></div>`).join("")}</div>`;
  }
},
/* ---- PROGRAMI ---- */
warmup:{html:()=>progHTML(PROGRAMS.warmup(),"Pred intervali, tempo teki in tekmo. Pripravi mišice, sklepe in srce na hitrejši tek ter zmanjša možnost poškodb.")},
stretch:{html:()=>progHTML(PROGRAMS.stretch(),"Po teku, ko so mišice tople. Vsak položaj zadrži mirno, brez zibanja in bolečine – le prijeten nateg.",true)},
circuit:{init:()=>{const g=goal();return {rounds:g&&g.lvl>=2?3:2}},html:st=>chips("rounds",[[2,"2 kroga · 16 min"],[3,"3 krogi · 22 min"]],st.rounds)+progHTML(PROGRAMS.circuit(st),"6 vaj za tekače. Vsako vajo izvajaš 40 s, sledi 20 s odmora. Navodila za vsako vajo najdeš v Knjižnici vaj.")},
/* ---- KNJIŽNICA ---- */
lib:{html:()=>`<div class="meta" style="margin:4px 0 12px">Teh 6 vaj sestavlja krog moči v tvojem načrtu. Kakovost pred hitrostjo.</div>`+EX.map((e,i)=>`<details class="acc exc"><summary><span class="ic num">${i+1}</span>${e.n}</summary><div class="bd"><p>${e.why}</p>
   <div class="exl"><small>Pravilna izvedba</small><ol>${e.cues.map(c=>`<li>${c}</li>`).join("")}</ol></div>
   <div class="exl bad"><small>Pogoste napake</small><ul>${e.mist.map(c=>`<li>${c}</li>`).join("")}</ul></div>
   <div class="vars"><div><small>Lažje</small><b>${e.easy}</b></div><div><small>Težje</small><b>${e.hard}</b></div></div></div></details>`).join("")+`<button class="btn pri" style="width:100%;margin-top:10px" data-g="circuit">▶ Začni krog moči</button>`},
/* ---- BOLEČINA ---- */
pain:{
  init:()=>({area:"",lvl:2,limp:false,worse:false,night:false,swell:false}),
  html:st=>`<div class="fl">Kje boli?</div><div class="tgs">${Object.entries(PAIN).map(([k,v])=>`<button class="tg ${st.area===k?"on":""}" data-tc="area=${k}">${v.n}</button>`).join("")}</div>
   <div class="fl">Moč bolečine: <span id="plv" class="num" style="font-size:18px;color:var(--tx)">${st.lvl}/10</span></div><input type="range" min="0" max="10" value="${st.lvl}" data-ti="lvl">
   <div class="fl">Kaj velja?</div><div class="tgs">${tog("limp","Šepam / spremenim korak",st.limp)}${tog("worse","Med tekom se stopnjuje",st.worse)}${tog("night","Boli v mirovanju ali ponoči",st.night)}${tog("swell","Oteklina ali modrica",st.swell)}</div>
   <div id="pres"></div><p class="foot" style="text-align:left">To ni diagnoza. Pomočnik daje splošne smernice – pri dvomu ali dolgotrajni bolečini se posvetuj z zdravnikom ali fizioterapevtom.</p>`,
  upd:st=>{
    $("plv").textContent=st.lvl+"/10";
    const l=+st.lvl, red=st.limp||st.night||st.swell||l>=6, yel=!red&&(l>=3||st.worse);
    const [cl,ic,ti,tx]=red?["r","🛑","Danes ne teci","Bolečina, ki spremeni korak, boli v mirovanju ali je močna, je znak, da tkivo potrebuje počitek. Če ne izzveni v 3–5 dneh ali se slabša, poišči zdravnika ali fizioterapevta."]
      :yel?["y","⚠️","Previdno – zamenjaj trening","Namesto teka izberi kolo, plavanje ali hojo. Čez 2–3 dni preizkusi 10–15 minut zelo lahkega teka. Če bolečina med tekom raste, prekini."]
      :["g","✅","Lahko tečeš lahkotno","Blaga bolečina (0–2), ki se med tekom ne stopnjuje, je običajno sprejemljiva. Teci lahko, brez intervalov, in spremljaj, kako se počutiš naslednji dan."];
    $("pres").innerHTML=`<div class="light ${cl}"><span>${ic}</span><div><b>${ti}</b><p>${tx}</p></div></div>${st.area?`<div class="note"><b>${PAIN[st.area].n}: </b>${PAIN[st.area].i}</div>`:""}
     <div class="note"><b>Pravilo 24 ur:</b> če je bolečina naslednje jutro hujša kot pred tekom, je bil trening preveč. Naslednji dan zmanjšaj obremenitev.</div>`;
  }
},
/* ---- PRIPRAVLJENOST ---- */
ready:{
  init:()=>({sleep:2,legs:2,sore:2,mood:2,stress:2}),
  html:st=>{const Q=[["sleep","😴 Spanje",["Slabo","Povprečno","Dobro"]],["legs","🦵 Noge",["Težke","Malo utrujene","Sveže"]],["sore","💢 Mišična bolečina",["Izrazita","Blaga","Nič"]],["mood","🙂 Volja",["Nič volje","Tako-tako","Komaj čakam"]],["stress","🧠 Stres",["Visok","Zmeren","Nizek"]]];
    return `<div class="meta" style="margin:4px 0 6px">Vzemi 20 sekund pred treningom. Iskreni odgovori dajo najboljši nasvet.</div>`+Q.map(q=>`<div class="fl">${q[1]}</div>`+chips(q[0],q[2].map((x,i)=>[i,x]),st[q[0]])).join("")+`<div id="rres"></div>`},
  upd:st=>{
    const sc=["sleep","legs","sore","mood","stress"].reduce((a,k)=>a+ +st[k],0), pct=Math.round(sc/10*100);
    const g=goal(); let today=null; if(g&&PLAN){today=PLAN.days.find(x=>x.d===iso(todayDate()))}

function calEvents(g,onlyFuture){
  const t=iso(todayDate());
  return PLAN.days.filter(d=>d.s&&(!onlyFuture||d.d>=t)).map(d=>{
    const dt=dateOf(d.d), wk=dt.getDay()===0||dt.getDay()===6;
    const hm=(d.t==="race"?CAL.race:wk?CAL.wtime:CAL.time).split(":").map(Number);
    const st=new Date(dt);st.setHours(hm[0]||0,hm[1]||0,0,0);
    const dur=d.t==="race"?Math.ceil((total(d.s)+5)/5)*5:Math.ceil(total(d.s)/5)*5;
    const en=new Date(st.getTime()+dur*60000);
    return {d:d.d,day:d,st,en,title:`${TICON[d.t]||"🏃"} ${d.title} · ${Math.round(total(d.s))} min`,desc:calDesc(d,g)};
  });
}
function calDesc(d,g){
  const L=[];
  d.s.forEach(x=>{
    if(x.rep&&x.items.length>3)L.push(`${x.rep}× krog: ${x.items.filter(y=>y[0]!=="P").map(y=>y[2]).join(", ")} (40 s dela / 20 s odmora)`);
    else if(x.rep)L.push(`${x.rep}× (${x.items.map(y=>fmt(y[1])+" "+y[2]).join(" + ")})`);
    else L.push(`${fmt(x[1])} – ${x[2]}${showPace(g)&&"ERT".includes(x[0])?" (≈ "+paceStr(g,x[0])+")":""}`);
  });
  return `${d.why}\n\n${L.map(x=>"• "+x).join("\n")}\n\n${g.name} · ${DLAB(g.dist)} · teden ${d.w} · aplikacija Korak`;
}
const pad=n=>String(n).padStart(2,"0");
const stamp=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+"&dates="+stamp(e.st)+"/"+stamp(e.en)+"&ctz="+encodeURIComponent(TZ)+"&details="+encodeURIComponent(e.desc);
}
function calCSV(g){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const dS=d=>`${pad(d.getMonth()+1)}/${pad(d.getDate())}/${d.getFullYear()}`;
  const tS=d=>{let h=d.getHours(),ap=h>=12?"PM":"AM";h=h%12||12;return `${pad(h)}:${pad(d.getMinutes())} ${ap}`};
  return "Subject,Start Date,Start Time,End Date,End Time,All Day Event,Description,Private\r\n"+
    calEvents(g,true).map(e=>[q(e.title),dS(e.st),tS(e.st),dS(e.en),tS(e.en),"False",q(e.desc.replace(/\n+/g," | ")),"True"].join(",")).join("\r\n");
}
function calICS(g){
  const esc2=s=>String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const fold=l=>{const out=[];let cur="";for(const ch of l){if(new TextEncoder().encode(cur+ch).length>73){out.push(cur);cur=" "+ch}else cur+=ch}out.push(cur);return out.join("\r\n")};
  const now=new Date(),ds=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Korak//Tekaski nacrt//SL","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+esc2("Korak – "+g.name)];
  calEvents(g,true).forEach(e=>{L.push("BEGIN:VEVENT","UID:"+g.id+"-"+e.d+"@korak","DTSTAMP:"+ds,"DTSTART:"+stamp(e.st),"DTEND:"+stamp(e.en),"SUMMARY:"+esc2(e.title),"DESCRIPTION:"+esc2(e.desc),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(e.title),"TRIGGER:-PT30M","END:VALARM","END:VEVENT")});
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n";
}

function computeAdapt(g,plan){
  if(ADOFF[g.id])return null;
  const t=iso(todayDate()), tD=todayDate();
  const all=logsOf(g).filter(l=>l.d<=t).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
  const recent=all.filter(l=>dayDiff(dateOf(l.d),tD)<=14);
  const planned=recent.filter(l=>l.planned).slice(0,3);
  const lastPain=all.find(l=>dayDiff(dateOf(l.d),tD)<=3&&l.pain===2);
  const missed=plan.days.filter(d=>d.s&&d.t!=="race"&&d.d<t&&dayDiff(dateOf(d.d),tD)<=7&&!isDone(g,d.d)).length;
  const sc=planned.length?planned.reduce((a,l)=>a+(l.feel-1)+(l.pain===1?0.5:l.pain===2?2:0),0)/planned.length:0;
  const easyCount=planned.filter(l=>l.feel===0).length, hardCount=planned.filter(l=>l.feel===3).length;
  if(lastPain) return {f:0.7,days:7,ic:"🩹",t:"Prilagojeno zaradi bolečine",m:"Po zadnjem vpisu z bolečino je obseg naslednjih 7 dni zmanjšan za 30 %. Pred tekom preveri Pomočnika pri bolečini.",tone:"r"};
  if(planned.length>=2&&sc>=1.2) return {f:0.85,days:14,ic:"😮‍💨",t:"Načrt smo olajšali",m:`Zadnji treningi so bili zahtevni. Naslednja 2 tedna je obseg zmanjšan za 15 %, da se telo prilagodi.${hardCount>=2&&g.lvl>0?" Če bo še vedno pretežko, razmisli o nižjem nivoju.":""}`,tone:"y",down:hardCount>=2&&g.lvl>0};
  if(missed>=2) return {f:0.9,days:7,ic:"📅",t:"Lažji povratek",m:`V zadnjem tednu si izpustil ${missed} ${missed===2?"treninga":missed<5?"treninge":"treningov"}. Naslednji teden je obseg zmanjšan za 10 % – brez lovljenja zamujenega.`,tone:"y"};
  if(planned.length>=3&&sc<=-0.67) return {f:1.08,days:14,ic:"🚀",t:"Gre ti odlično",m:`Zadnji treningi so bili lahki. Naslednja 2 tedna je obseg povečan za 8 %.${easyCount>=3&&g.lvl<3?" Lahko razmisliš tudi o višjem nivoju.":""}`,tone:"g",up:easyCount>=3&&g.lvl<3};
  return null;
}
function scaleSegs(s,f){
  return s.map(x=>{
    if(x.rep){const main=x.items.some(y=>"ERT".includes(y[0]));if(!main||x.items.length>3)return x;return Object.assign({},x,{rep:Math.max(1,Math.round(x.rep*f))})}
    if("ERT".includes(x[0])&&x[1]>=5){const m=Math.max(3,Math.round(x[1]*f));return [x[0],m,x[2].replace(/\(≈ [\d,]+ km\)/,"")+(x[2].includes("≈")?`(≈ ${km1(m/paces(goal()).easy)} km)`:"")]}
    return x;
  });
}
function applyAdapt(g){
  const a=computeAdapt(g,PLAN);PLAN.adapt=a;if(!a)return;
  const tD=todayDate(), t=iso(tD);
  PLAN.days.forEach(d=>{
    if(!d.s||d.d<t||dayDiff(tD,dateOf(d.d))>=a.days||["race","shake","sharpen","strength"].includes(d.t))return;
    const ns=scaleSegs(d.s,a.f);
    if(Math.abs(total(ns)-total(d.s))>=1){d.s=ns;d.adj=Math.round((a.f-1)*100)}
  });
}

let DTAB="pregled", CHM="km";
function statsCtx(g){
  const t=iso(todayDate());
  const L=logsOf(g), LA=Object.values(LOG);
  const work=PLAN.days.filter(d=>d.s);
  const past=work.filter(d=>d.d<=t);
  const doneN=work.filter(d=>isDone(g,d.d)).length;
  // niz
  const seq=past.filter(d=>!(d.d===t&&!isDone(g,d.d)));
  let streak=0;for(let i=seq.length-1;i>=0;i--){if(isDone(g,seq[i].d))streak++;else break}
  let best=0,cur=0;seq.forEach(d=>{if(isDone(g,d.d)){cur++;best=Math.max(best,cur)}else cur=0});
  // tedni
  const perfect=PLAN.weeks.filter(w=>{const ws=w.days.filter(d=>d.s);return ws.length&&ws.every(d=>isDone(g,d.d))}).length;
  let wstreak=0;for(let i=PLAN.weeks.length-1;i>=0;i--){const w=PLAN.weeks[i],ws=w.days.filter(d=>d.s);if(!ws.length||ws[0].d>t)continue;const pastW=ws.filter(d=>d.d<t);if(ws.every(d=>isDone(g,d.d)))wstreak++;else if(pastW.length===ws.length||pastW.some(d=>!isDone(g,d.d)))break}
  const kmAll=LA.reduce((a,l)=>a+(l.km||0),0), minAll=LA.reduce((a,l)=>a+(l.min||0),0);
  const typeDone=tp=>work.filter(d=>d.t===tp&&isDone(g,d.d)).length;
  const peakDone=work.some(d=>d.title==="Najdaljši tek"&&isDone(g,d.d));
  const pl=L.filter(l=>l.km>=2&&l.min).sort((a,b)=>a.d<b.d?-1:1);
  const bestPace=pl.length?Math.min(...pl.map(l=>l.min/l.km)):null;
  const improved=pl.length>=3&&bestPace<=pl[0].min/pl[0].km*0.95;
  const longestKm=Math.max(0,...L.map(l=>l.km||0)), longestMin=Math.max(0,...L.map(l=>l.min||0));
  const wk=PLAN.weeks.map(w=>{const ws=w.mon,we=iso(addDays(dateOf(w.mon),6));const x=L.filter(l=>l.d>=ws&&l.d<=we);
    return {km:x.reduce((a,l)=>a+(l.km||0),0),min:x.reduce((a,l)=>a+(l.min||0),0),plan:w.days.reduce((a,d)=>a+(d.s&&d.t!=="strength"?runMin(d.s):0),0),ph:w.ph}});
  return {g,t,L,LA,work,doneN,streak,best,perfect,wstreak,kmAll,minAll,strength:typeDone("strength"),guided:sget("korak_guided",0),
    peakDone,sharpen:typeDone("sharpen")>0,race:typeDone("race")>0,bestPace,improved,longestKm,longestMin,wk,
    maxWeekKm:Math.max(0,...wk.map(w=>w.km)),half:work.length&&doneN/work.length>=0.5};
}

  const h=`<div class="grab"></div>${PF.first?"":`<button class="close" data-close>✕</button>`}
  ${PF.first?`<div class="welc"><div class="wlogo">K</div><h3>Dobrodošel v Koraku</h3><p>Tvoj osebni tekaški trener. Ustvari svoj profil – tvoji treningi, dnevnik in značke bodo ločeni od drugih uporabnikov.</p></div>`:`<div class="ghead" style="--tc:${PF.c}"><span class="tic">${PF.ic}</span><div><h3>${PF.id?"Uredi profil":"Nov profil"}</h3><div class="meta">Vsak profil ima svoje cilje, treninge in dnevnik.</div></div></div>`}
  <div class="pfprev"><span style="background:${PF.c}">${PF.ic}</span><b>${esc(PF.name)||"Tvoje ime"}</b></div>
  <div class="fl">Ime</div><input class="inp" data-pf="name" maxlength="20" placeholder="npr. Vladimir" value="${esc(PF.name)}">
  <div class="fl">Ikona</div><div class="pics">${PICS.map(x=>`<button class="${PF.ic===x?"on":""}" data-pfic="${x}">${x}</button>`).join("")}</div>
  <div class="fl">Barva</div><div class="pcols">${PCOL.map(x=>`<button class="${PF.c===x?"on":""}" style="background:${x}" data-pfc="${x}"></button>`).join("")}</div>
  <div class="fl">PIN (neobvezno)</div><input class="inp" data-pf="pin" inputmode="numeric" maxlength="4" placeholder="4 števke – za deljeno napravo" value="${esc(PF.pin)}">
  <div class="hint">PIN prepreči, da bi kdo drug na isti napravi pomotoma odprl tvoj profil. Ni namenjen zaščiti občutljivih podatkov.</div>
  <div class="err" id="pferr"></div>
  <div class="cta"><button class="btn pri" data-pfsave>${PF.id?"Shrani":PF.first?"Začni":"Ustvari profil"}</button></div>`;
  if(keep){sh.innerHTML=h;sh.scrollTop=top}else openSheet(h);
}
function saveProfForm(){
  const name=(PF.name||"").trim(), pin=(PF.pin||"").trim(), err=document.getElementById("pferr");
  if(!name){err.textContent="Vpiši ime.";return}
  if(pin&&!/^\d{4}$/.test(pin)){err.textContent="PIN naj ima točno 4 števke.";return}
  if(PROFS.list.some(p=>p.id!==PF.id&&p.name.toLowerCase()===name.toLowerCase())){err.textContent="Profil s tem imenom že obstaja.";return}
  if(PF.id){const p=PROFS.list.find(x=>x.id===PF.id);Object.assign(p,{name,ic:PF.ic,c:PF.c,pin:pin||undefined});saveProfs();PF=null;closeSheet();renderWho();openProfiles();return}
  const id="p"+Date.now().toString(36);
  PROFS.list.push({id,name,ic:PF.ic,c:PF.c,pin:pin||undefined});
  RAW.set("korak:p:"+id,{__ts:Date.now()});
  saveProfs();PF=null;FRESH=false;closeSheet();switchProfile(id);
  toast("Pozdravljen, "+name+"! 👋");
}

/* ---- seznam profilov ---- */
let PDEL=null, PINFOR=null;
function openProfiles(){
  const cur=PROFS.cur;
  const h=`<div class="grab"></div><button class="close" data-close>✕</button>
  <div class="ghead" style="--tc:#a78bfa"><span class="tic">👥</span><div><h3>Profili</h3><div class="meta">Podatki vsakega profila so popolnoma ločeni.</div></div></div>
  ${PROFS.list.map(p=>{const st=p.id===cur?STATE:RAW.get("korak:p:"+p.id,{}),gs=(st&&st.korak_goals)||[],lg=Object.keys((st&&st.korak_log)||{}).length,ag=gs.find(g=>g.id===(st&&st.korak_active))||gs[0];
    return `<div class="prow2 ${p.id===cur?"on":""}"><button class="pmain" data-psw="${p.id}"><span class="pav" style="background:${p.c}">${p.ic}</span><div><b>${esc(p.name)}${p.pin?" 🔒":""}</b><small>${ag?esc(ag.name)+" · "+DLAB(ag.dist):"Brez cilja"} · ${lg} ${lg===1?"vpis":lg===2?"vpisa":lg<5?"vpisi":"vpisov"}</small></div>${p.id===cur?'<em>Aktiven</em>':""}</button>
      <div class="pacts"><button class="tg" data-pedit="${p.id}">Uredi</button>${PROFS.list.length>1?`<button class="tg ${PDEL===p.id?"bad on":""}" data-pdel="${p.id}">${PDEL===p.id?"Res izbrišem?":"Izbriši"}</button>`:""}</div></div>`}).join("")}
  ${PINFOR?`<div class="pinbox"><b>Vpiši PIN za »${esc(PROFS.list.find(x=>x.id===PINFOR).name)}«</b><input class="inp pin" id="pinin" inputmode="numeric" maxlength="4" autocomplete="off"><div class="err" id="pinerr"></div><div class="cta"><button class="btn sec" data-pincancel>Prekliči</button><button class="btn pri" data-pinok>Odpri</button></div></div>`:""}
  <button class="addgoal" data-padd style="margin-top:6px">+ Nov profil</button>
  <div class="fl">Videz aplikacije</div><div class="tgs">${[["auto","🌓 Samodejno"],["light","☀️ Svetlo"],["dark","🌙 Temno"]].map(x=>`<button class="tg ${THEME.mode===x[0]?"on":""}" data-theme-set="${x[0]}">${x[1]}</button>`).join("")}</div>
  <div class="fl">Shranjevanje</div>
  <div class="sync ${CLOUD.on?"on":""}"><span>${CLOUD.on?"☁️":"📱"}</span><div><b>${CLOUD.on?"Sinhronizirano z računom":"Shranjeno na tej napravi"}</b><small>${CLOUD.on?"Profili in treningi so zasebno shranjeni v tvojem računu in dostopni na vseh tvojih napravah. Drugi uporabniki jih ne vidijo.":"Podatki ostanejo v tem brskalniku. Vsak, ki aplikacijo odpre na svoji napravi, ima svoje, ločene podatke. Za prenos na drugo napravo uporabi varnostno kopijo."}</small></div></div>
  <div class="fl">Varnostna kopija profila »${esc((curProf()||{}).name||"")}«</div>
  <div class="cta" style="margin-top:0">${DL?`<button class="btn sec" data-bkexp>⬇ Izvozi</button>`:`<button class="btn sec" data-bkcopy>Kopiraj kopijo</button>`}<label class="btn sec" style="text-align:center">⬆ Uvozi<input type="file" accept=".json,application/json,text/plain" data-bkimp hidden></label></div>
  <div class="hint">Uvoz ustvari nov profil iz datoteke – obstoječi podatki se ne prepišejo.</div><div class="err" id="bkmsg"></div>`;
  const sh=document.getElementById("sheet"),keep=document.getElementById("ov").classList.contains("on")&&sh.querySelector(".prow2"),top=sh.scrollTop;
  if(keep){sh.innerHTML=h;sh.scrollTop=top}else openSheet(h);
  PROFOPEN=true;
  if(PINFOR)setTimeout(()=>{const i=document.getElementById("pinin");i&&i.focus()},50);
}
let PROFOPEN=false;
function exportData(){const p=curProf();return JSON.stringify({app:"korak",v:1,profile:{name:p.name,ic:p.ic,c:p.c},state:STATE,exported:new Date().toISOString()},null,1)}
function importData(txt){
  const m=document.getElementById("bkmsg");
  try{const o=JSON.parse(txt);if(o.app!=="korak"||!o.state||typeof o.state!=="object")throw 0;
    let name=(o.profile&&o.profile.name)||"Uvoženo";const base=name;let n=2;while(PROFS.list.some(p=>p.name.toLowerCase()===name.toLowerCase()))name=base+" "+(n++);
    const id="p"+Date.now().toString(36),st=Object.assign({},o.state,{__ts:Date.now()});
    PROFS.list.push({id,name,ic:(o.profile&&o.profile.ic)||"🏃",c:(o.profile&&o.profile.c)||"#d4ff3a"});RAW.set("korak:p:"+id,st);saveProfs();
    if(CLOUD.on)cloudWrite("p_"+id,{state:JSON.stringify(st),ts:st.__ts});
    switchProfile(id);toast("Uvoženo kot »"+name+"«");
  }catch(e){if(m){m.style.color="";m.textContent="Datoteka ni veljavna varnostna kopija Koraka."}}
}
function deleteProfile(id){
  PROFS.list=PROFS.list.filter(p=>p.id!==id);RAW.del("korak:p:"+id);
  if(CLOUD.on)cloudDel("p_"+id);
  if(PROFS.cur===id){PROFS.cur=PROFS.list[0].id;saveProfs();switchProfile(PROFS.cur);return}
  saveProfs();openProfiles();
}

document.addEventListener("input",e=>{const el=e.target.closest("[data-pf]");if(el&&PF){PF[el.dataset.pf]=el.value;if(el.dataset.pf==="name"){const b=document.querySelector(".pfprev b");if(b)b.textContent=el.value||"Tvoje ime"}}});
document.addEventListener("change",e=>{const el=e.target.closest("[data-bkimp]");if(!el||!el.files[0])return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(el.files[0]);el.value=""});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pinin"){const b=document.querySelector("[data-pinok]");b&&b.click()}});
document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);let el;
  if(q("[data-prof]")){e.stopPropagation();PDEL=null;PINFOR=null;openProfiles();return}
  if(PF){
    if(el=q("[data-pfic]")){e.stopPropagation();PF.ic=el.dataset.pfic;drawProfForm(true);return}
    if(el=q("[data-pfc]")){e.stopPropagation();PF.c=el.dataset.pfc;drawProfForm(true);return}
    if(q("[data-pfsave]")){e.stopPropagation();saveProfForm();return}
  }
  if(!PROFOPEN)return;
  if(el=q("[data-psw]")){e.stopPropagation();const id=el.dataset.psw;if(id===PROFS.cur){closeSheet();return}const p=PROFS.list.find(x=>x.id===id);if(p.pin){PINFOR=id;openProfiles();return}closeSheet();switchProfile(id);toast("Profil: "+p.name);return}
  if(q("[data-pinok]")){e.stopPropagation();const p=PROFS.list.find(x=>x.id===PINFOR),v=document.getElementById("pinin").value;if(v===p.pin){PINFOR=null;closeSheet();switchProfile(p.id);toast("Profil: "+p.name)}else{document.getElementById("pinerr").textContent="Napačen PIN.";document.getElementById("pinin").value=""}return}
  if(q("[data-pincancel]")){e.stopPropagation();PINFOR=null;openProfiles();return}
  if(el=q("[data-pedit]")){e.stopPropagation();PROFOPEN=false;profForm(el.dataset.pedit);return}
  if(el=q("[data-pdel]")){e.stopPropagation();const id=el.dataset.pdel;if(PDEL!==id){PDEL=id;openProfiles();return}PDEL=null;deleteProfile(id);return}
  if(q("[data-padd]")){e.stopPropagation();PROFOPEN=false;profForm(null,false);return}
  if(q("[data-bkexp]")){e.stopPropagation();const p=curProf(),m=document.getElementById("bkmsg");DL.save({filename:`korak-${fslug(p.name)}-${iso(todayDate())}.json`,data:exportData()}).then(()=>{m.style.color="var(--acc)";m.textContent="✓ Varnostna kopija shranjena."}).catch(er=>{m.style.color="";m.textContent=er&&er.code==="declined"?"Prenos preklican.":"Prenos ni uspel."});return}
  if(q("[data-bkcopy]")){e.stopPropagation();const m=document.getElementById("bkmsg");navigator.clipboard.writeText(exportData()).then(()=>{m.style.color="var(--acc)";m.textContent="✓ Kopirano v odložišče."}).catch(()=>{m.textContent="Kopiranje ni uspelo."});return}
},true);

/* ================= OBLAK (zasebno po računu) ================= */
function cloudWrite(k,data){
  if(!CLOUD.on)return Promise.resolve();
  CLOUD.chain=CLOUD.chain.then(()=>CLOUD.col.doc(k).set(data)).catch(e=>cloudFail(e));
  return CLOUD.chain;
}
function cloudDel(k){if(!CLOUD.on)return;CLOUD.chain=CLOUD.chain.then(()=>CLOUD.col.doc(k).delete()).catch(e=>cloudFail(e))}
function cloudFail(e){
  const c=e&&e.code;
  if(c==="unavailable"||c==="resource_exhausted")return;
  CLOUD.on=false;CLOUD.status="local";if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}renderWho();
  if(c==="quota_exceeded")toast("Prostor v oblaku je poln – podatki so shranjeni na napravi.");
}
function cloudPush(){
  if(!CLOUD.on||!PROFS.cur)return;
  clearTimeout(CLOUD.timer);
  const pid=PROFS.cur;
  CLOUD.timer=setTimeout(()=>{if(PROFS.cur!==pid)return;CLOUD.lastPush=STATE.__ts;cloudWrite("p_"+pid,{state:JSON.stringify(STATE),ts:STATE.__ts||Date.now()})},900);
}
function cloudPushProfs(){if(!CLOUD.on)return;clearTimeout(CLOUD.ptimer);CLOUD.ptimer=setTimeout(()=>cloudWrite("profiles",{list:JSON.stringify(PROFS.list),ts:PROFS.ts||Date.now()}),500)}
async function cloudSyncProfile(pid){
  if(!CLOUD.on)return;
  try{
    const s=await CLOUD.col.doc("p_"+pid).get();
    const loc=RAW.get("korak:p:"+pid,{})||{}, lts=loc.__ts||0;
    if(s.exists){const d=s.data(), rts=+d.ts||0;
      if(rts>lts){const st=JSON.parse(d.state);RAW.set("korak:p:"+pid,st);if(PROFS.cur===pid){STATE=st;loadGlobals();rebuild(true);renderAll()}}
      else if(lts>rts)await cloudWrite("p_"+pid,{state:JSON.stringify(loc),ts:lts});
    } else if(lts) await cloudWrite("p_"+pid,{state:JSON.stringify(loc),ts:lts});
  }catch(e){cloudFail(e)}
}
function cloudWatch(pid){
  if(!CLOUD.on)return;
  if(CLOUD.unsub){CLOUD.unsub();CLOUD.unsub=null}
  CLOUD.unsub=CLOUD.col.doc("p_"+pid).onSnapshot(s=>{
    if(!s.exists||s.metadata.hasPendingWrites||PROFS.cur!==pid)return;
    const d=s.data(),rts=+d.ts||0;
    if(rts>(STATE.__ts||0)){try{STATE=JSON.parse(d.state);persistLocal();loadGlobals();rebuild(true);renderAll();toast("☁️ Posodobljeno z druge naprave")}catch(e){}}
  },e=>cloudFail(e));
}
async function cloudInit(){
  const timer=setTimeout(()=>{},10000);
  try{
    const ps=await CLOUD.col.doc("profiles").get();
    let changed=false;
    if(ps.exists){
      const d=ps.data(), rl=JSON.parse(d.list||"[]"), rts=+d.ts||0;
      rl.forEach(rp=>{const lp=PROFS.list.find(x=>x.id===rp.id);if(!lp){PROFS.list.push(rp);changed=true}else if(rts>(PROFS.ts||0)){Object.assign(lp,rp)}});
      if(PROFS.list.length>rl.length)changed=true;
      if(rts>(PROFS.ts||0))PROFS.ts=rts;
    } else if(PROFS.list.length) changed=true;
    if(!PROFS.cur&&PROFS.list.length){PROFS.cur=PROFS.list[0].id;FRESH=false}
    RAW.set("korak:profiles",PROFS);
    if(changed)await cloudWrite("profiles",{list:JSON.stringify(PROFS.list),ts:PROFS.ts||Date.now()});
    if(!CLOUD.on)return;
    for(const p of PROFS.list){await cloudSyncProfile(p.id);if(!CLOUD.on)return}
    if(PROFS.cur){loadState(PROFS.cur);loadGlobals();
      if(document.getElementById("sheet").querySelector(".welc")&&PROFS.list.length)closeSheet();
      rebuild(true);renderAll();cloudWatch(PROFS.cur)}
    CLOUD.status="cloud";renderWho();
  }catch(e){cloudFail(e)}finally{clearTimeout(timer)}
}
(async()=>{
  try{
    if(NATIVE)return;const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    if(typeof user.can==="function"){const w=await user.can("data.write");if(w===false)return}
    CLOUD.db=db;CLOUD.uid=uid;CLOUD.col=db.collection("data/users/"+uid);CLOUD.on=true;
    await cloudInit();
  }catch(e){CLOUD.on=false}
})();

(function init(){
  rebuild(); renderAll();
  const v=location.hash.slice(1);
  show(["danes","nacrt","dnevnik","cilji","nasveti"].includes(v)?v:"danes");
  if(!PROFS.cur)setTimeout(()=>{if(!PROFS.cur)profForm(null,true)},CLOUD.on?1500:300);
})();
</script>
</body>
