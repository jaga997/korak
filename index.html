<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Korak · Tekaški načrti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d10; --card:#14171c; --card2:#1b1f26; --line:#262b33;
  --tx:#f2f4f7; --mut:#8b93a1; --acc:#d4ff3a;
  --easy:#34d399; --tempo:#fb923c; --fast:#f43f5e; --walk:#64748b; --wu:#60a5fa;
  --str:#a78bfa; --mob:#22d3ee; --rest:#3b4250; --warn:#fbbf24;
  --f:"Inter Tight",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  --tx2:#c9ced6; --mut2:#4b5363; --sheet:#121519; --track:#2b3240; --acct:#d4ff3a;
  --accbg:#1b2310; --accbd:#3a4a1a; --warnbg:#221c0c; --warnbd:#5a4612; --redbg:#251114; --redbd:#5a1d26; --red:#fb7185;
  --grnbg:#0f2119; --grnbd:#1d5a40; --bluebg:#13202e; --bluebd:#1f3a55; --orbd:#5a3312;
  --hero1:#171b21; --hero2:#101318; --navbg:rgba(20,23,28,.92);
}
html[data-theme=light]{
  --bg:#f3f4f6; --card:#ffffff; --card2:#eef0f3; --line:#e1e4e9; --tx:#13161b; --mut:#687180; --mut2:#a0a7b3;
  --acc:#c8f03c; --acct:#4d7c0f; --easy:#059669; --tempo:#ea580c; --fast:#e11d48; --walk:#64748b; --wu:#2563eb;
  --str:#7c3aed; --mob:#0891b2; --rest:#c5ccd6; --warn:#b45309;
  --tx2:#3f4652; --sheet:#ffffff; --track:#e3e7ec;
  --accbg:#f1fad8; --accbd:#bcdc6a; --warnbg:#fff7e8; --warnbd:#f3d38c; --redbg:#fff1f2; --redbd:#fecdd3; --red:#e11d48;
  --grnbg:#ecfdf5; --grnbd:#a7f3d0; --bluebg:#eff6ff; --bluebd:#bfdbfe; --orbd:#fed7aa;
  --hero1:#ffffff; --hero2:#eef1f4; --navbg:rgba(255,255,255,.9);
  color-scheme:light;
}
html[data-theme=light] .card,html[data-theme=light] .day,html[data-theme=light] .mini,html[data-theme=light] .tile,html[data-theme=light] .goal,html[data-theme=light] .wsum,html[data-theme=light] .vol,html[data-theme=light] .lentry,html[data-theme=light] .hero,html[data-theme=light] .ghero,html[data-theme=light] .acc,html[data-theme=light] .note,html[data-theme=light] .heat,html[data-theme=light] .wdet,html[data-theme=light] .rec,html[data-theme=light] .badge,html[data-theme=light] .brow,html[data-theme=light] .streak,html[data-theme=light] .lstats div,html[data-theme=light] .prow2,html[data-theme=light] nav{box-shadow:0 1px 3px rgba(16,24,40,.06)}
html[data-theme=light] .day.rest{box-shadow:none}
html[data-theme=light] .tg.on,html[data-theme=light] .opt.on,html[data-theme=light] .feel.on,html[data-theme=light] .weeks button.on,html[data-theme=light] .day.isToday,html[data-theme=light] .goal.act,html[data-theme=light] .prow2.on,html[data-theme=light] .pinbox,html[data-theme=light] .cki.on i{border-color:var(--acct)}
html[data-theme=light] .ov{background:rgba(15,20,30,.35)}
html[data-theme=light] .hero{background:radial-gradient(120% 90% at 100% 0%,rgba(200,240,60,.35),transparent 55%),linear-gradient(160deg,#fff,#f0f2f5)}
html[data-theme=light] .ghero{background:radial-gradient(90% 120% at 0% 0%,rgba(167,139,250,.18),transparent 60%),radial-gradient(80% 100% at 100% 100%,rgba(200,240,60,.3),transparent 60%),#fff}
html[data-theme=light] .tile{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 12%,#fff),#fff 60%)}
html[data-theme=light] .tile .tag{color:color-mix(in srgb,var(--tc) 55%,#000)}
html[data-theme=light] .vol .col.race span{background:repeating-linear-gradient(45deg,#d9ec9c,#d9ec9c 4px,#eef6cf 4px,#eef6cf 8px)}
html[data-theme=light] .sdots i.miss{background:#fecdd3}
html[data-theme=light] .flame.cold{opacity:.35}
html[data-theme=light] .pl .glow{opacity:.22}
html[data-theme=light] #cele{background:rgba(240,242,245,.85)}
html[data-theme=light] .cbadge,html[data-theme=light] .badge.ok .bi{background:#f1fad8}
html[data-theme=light] .hc.miss{background:#fecdd3;color:#be123c}
html[data-theme=light] .wday.miss{background:#fff1f2;color:#be123c}
html[data-theme=light] .badge .bi i{opacity:.55}
html[data-theme=light] .logo,html[data-theme=light] .wlogo{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.thbtn{width:36px;height:36px;padding:0;display:grid;place-items:center;font-size:16px}
.hacts{display:flex;gap:8px;align-items:center}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:var(--f);font-size:15px;line-height:1.45}
button,input{font-family:var(--f)}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 100px;position:relative}
.num{font-family:"Barlow Condensed",var(--f);font-weight:700;letter-spacing:.2px}
header{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:#0b0d10;font-weight:800;font-family:"Barlow Condensed",var(--f);font-size:20px;flex:none}
.brand b{font-size:16px;display:block}
.brand small{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 13px;font-weight:600;font-size:12.5px;cursor:pointer;flex:none}

.hero{margin-top:12px;border-radius:22px;padding:20px;background:
 radial-gradient(120% 90% at 100% 0%,rgba(212,255,58,.18),transparent 55%),
 linear-gradient(160deg,var(--hero1),var(--hero2));border:1px solid var(--line);display:flex;gap:16px;align-items:center}
.hero .big{font-size:64px;line-height:.9;color:var(--acct)}
.hero .lab{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:600}
.hero .race{font-weight:600;margin-top:6px}
.ring{margin-left:auto;position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-size:24px;display:block;line-height:1}
.ring .rv small{font-size:10px;color:var(--mut)}

h2{font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--mut);margin:24px 2px 10px;font-weight:600}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.today{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.06)}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.today h3,.card h3{font-size:24px;margin:10px 0 2px;line-height:1.15}
.meta{color:var(--mut);font-size:13px;display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--tx);font-weight:600}
.bar{display:flex;height:34px;border-radius:9px;overflow:hidden;gap:2px;margin:14px 0 4px;align-items:flex-end}
.bar span{display:block;border-radius:3px;min-width:3px}
.cta{margin-top:14px;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:14px;cursor:pointer}
.btn.pri{background:var(--acc);color:#0b0d10}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.done{background:var(--accbg);color:var(--acct);border:1px solid var(--accbd)}
.btn.del{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}

.next{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.next::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer}
.mini .d{font-size:12px;color:var(--mut)}
.mini .t{font-weight:600;margin:6px 0 2px;font-size:14px;line-height:1.2}
.mini .m{font-size:12px;color:var(--mut)}

.vol{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px 10px;margin-bottom:12px}
.vol .cols{display:flex;align-items:flex-end;gap:4px;height:96px}
.vol .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0}
.vol .col span{width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--track);transition:background .2s}
.vol .col.on span{background:var(--acc)}
.vol .col.race span{background:repeating-linear-gradient(45deg,#4a5a17,#4a5a17 4px,#3a4612 4px,#3a4612 8px)}
.vol .col.race.on span{background:var(--acc)}
.vol .col small{font-size:10px;color:var(--mut);margin-top:5px}
.vol .col.on small{color:var(--acct);font-weight:700}
.vol .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:8px}
.wsum{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;margin-bottom:12px}
.wsum div{text-align:center;flex:1}
.wsum b{font-size:26px;display:block;line-height:1}
.wsum small{color:var(--mut);font-size:11px}
.wfocus{color:var(--mut);font-size:13px;margin:0 2px 12px}
.wfocus .ph{display:inline-block;color:#0b0d10;background:var(--acc);font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px;text-transform:uppercase;letter-spacing:.6px}
.day{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 10px;margin-bottom:8px;cursor:pointer;position:relative}
.day.isToday{border-color:var(--acc)}
.day.rest{background:transparent;border-style:dashed}
.dd{width:46px;text-align:center;flex:none}
.dd small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;font-weight:600}
.dd b{font-size:24px;line-height:1}
.di{flex:1;min-width:0}
.di .t{font-weight:600;font-size:15px}
.di .s{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.di .bar{height:6px;margin:7px 0 0;border-radius:4px}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:none;cursor:pointer;color:transparent;font-weight:800}
.ck.on{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.todayTag{position:absolute;top:-8px;left:12px;background:var(--acc);color:#0b0d10;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.6px}

.goal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:10px}
.goal.act{border-color:var(--acc)}
.goal .gt{display:flex;align-items:center;gap:12px}
.goal .gd{width:56px;height:56px;border-radius:14px;background:var(--card2);display:grid;place-items:center;text-align:center;flex:none}
.goal .gd b{font-size:22px;line-height:1;display:block}
.goal .gd small{font-size:10px;color:var(--mut)}
.goal .gn{font-weight:700;font-size:16px}
.goal .gm{color:var(--mut);font-size:12.5px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 4px}
.prog span{display:block;height:100%;background:var(--acc);border-radius:6px}
.goal .cta{margin-top:12px}
.goal .btn{padding:10px;font-size:13px}
.addgoal{width:100%;border:1.5px dashed var(--line);background:none;color:var(--tx);border-radius:20px;padding:18px;font-weight:700;cursor:pointer;font-size:15px}

.acc{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.acc summary{list-style:none;padding:15px 16px;font-weight:600;cursor:pointer;display:flex;gap:10px;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font-size:15px;flex:none}
.acc summary:after{content:"+";margin-left:auto;color:var(--mut);font-size:20px;font-weight:400}
.acc[open] summary:after{content:"–"}
.acc .bd{padding:0 16px 16px;color:var(--tx2);font-size:14px}
.acc .bd p{margin-bottom:8px}
.acc .bd ul{padding-left:18px}
.acc .bd li{margin-bottom:5px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl div{position:relative;margin-bottom:10px}
.tl div:before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.tl b{color:var(--tx)}
.zones{display:grid;gap:8px}
.zone{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.zone i{width:10px;height:36px;border-radius:4px;flex:none}
.zone b{display:block;font-size:14px;color:var(--tx)}
.zone span{font-size:12.5px;color:var(--mut)}
.zone em{font-style:normal;margin-left:auto;color:var(--acct);font-weight:700;white-space:nowrap;font-size:14px}

nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 32px);max-width:448px;background:var(--navbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;display:flex;padding:6px;z-index:20}
nav button{flex:1;background:none;border:0;color:var(--mut);font-weight:600;font-size:10.5px;min-width:0;padding:8px 0;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:20px;height:20px}
nav button.on{color:var(--acct);background:var(--accbg)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheetwrap{position:relative;width:100%;max-width:480px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-bottom:0;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px 28px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:24px;margin:10px 0 4px;line-height:1.15}
.close{position:absolute;right:14px;top:12px;background:var(--card2);border:1px solid var(--line);color:var(--tx);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;z-index:2}
.stats{display:flex;gap:8px;margin:14px 0}
.stats div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stats b{font-size:24px;display:block;line-height:1}
.stats small{font-size:11px;color:var(--mut)}
.steps{margin:6px 0 14px}
.step{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.step i{width:6px;align-self:stretch;border-radius:4px;flex:none}
.step .sn{flex:1}
.step .sn b{display:block;font-size:14.5px}
.step .sn small{color:var(--mut);font-size:12px;display:block}
.step .sn small.p{color:var(--acct)}
.step .sd{font-size:20px;white-space:nowrap}
.repbox{border:1px solid var(--line);border-radius:14px;padding:4px 12px;margin:8px 0;background:var(--card)}
.repbox .rh{font-size:12px;color:var(--acct);font-weight:700;padding-top:8px;text-transform:uppercase;letter-spacing:.8px}
.repbox .step:last-child{border-bottom:0}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--tx2);margin-bottom:10px}
.note b{color:var(--tx)}
.note.warn{border-color:var(--warnbd);background:var(--warnbg)}
.note.warn b{color:var(--warn)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.ex span:nth-child(even){color:var(--acct);font-weight:600;text-align:right}
.splits{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.splits div{background:var(--card2);border-radius:10px;padding:7px;text-align:center;font-size:12px;color:var(--mut)}
.splits b{display:block;color:var(--tx);font-size:16px}
.foot{color:var(--mut);font-size:11.5px;text-align:center;margin-top:22px}

/* obrazec */
.fl{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:600;margin:18px 0 8px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 13px;font-size:15px;outline:none}
.inp:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:12px 6px;cursor:pointer;text-align:center}
.opt b{display:block;font-size:22px;line-height:1}
.opt small{color:var(--mut);font-size:11px}
.opt.on{border-color:var(--acc);background:var(--accbg)}
.opt.on b{color:var(--acct)}
.lv{display:flex;gap:12px;align-items:center;text-align:left;width:100%;margin-bottom:8px;padding:12px 14px}
.lv .dots{display:flex;gap:3px;flex:none}
.lv .dots i{width:6px;height:18px;border-radius:3px;background:var(--track)}
.lv .dots i.f{background:var(--acc)}
.lv b{font-size:15px}
.lv small{display:block;font-size:12.5px}
.prev{margin-top:16px}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:1px}
.hint{color:var(--mut);font-size:12px;margin-top:6px}


/* vodnik */
.ghero{margin-top:16px;border-radius:22px;padding:20px;border:1px solid var(--line);background:radial-gradient(90% 120% at 0% 0%,rgba(167,139,250,.22),transparent 60%),radial-gradient(80% 100% at 100% 100%,rgba(212,255,58,.14),transparent 60%),var(--card)}
.ghero .glab{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--acct)}
.ghero h3{font-size:24px;margin:6px 0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 13%,var(--card)),var(--card) 60%);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:142px;transition:transform .15s,border-color .15s}
.tile:active{transform:scale(.98)}
.tile:last-child:nth-child(odd){grid-column:span 2;min-height:0}
.tile:hover{border-color:color-mix(in srgb,var(--tc) 50%,var(--line))}
.tile .tic,.ghead .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--tc) 18%,transparent);border:1px solid color-mix(in srgb,var(--tc) 35%,transparent);margin-bottom:6px;flex:none}
.tile b{font-size:15px;line-height:1.2}
.tile small{color:var(--mut);font-size:12px;line-height:1.35;flex:1}
.tile .tag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);padding:3px 8px;border-radius:999px;margin-top:6px}
.ghead{display:flex;gap:12px;align-items:center;margin:6px 40px 14px 0}
.ghead h3{margin:0 0 2px;font-size:22px}
.ghead .tic{margin:0;width:46px;height:46px;font-size:24px;border-radius:14px}
.tgs{display:flex;flex-wrap:wrap;gap:8px}
.tg{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tg.on{background:var(--accbg);border-color:var(--acc);color:var(--acct)}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.rc small{display:block;color:var(--mut);font-size:11px}
.rc b{font-size:28px;line-height:1.1;display:block;color:var(--acct)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow span:first-child{flex:1}
.prow .num{font-size:18px}
.mut{color:var(--mut);font-size:12.5px}
.fcard{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.fcard>span{font-size:22px;flex:none}
.fcard b{font-size:15px}
.fcard p{color:var(--tx2);font-size:13.5px;margin-top:3px}
.gels{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
.gels span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--mut);text-align:center}
.gels b{display:block;color:var(--tempo);font-size:16px}
.brhead{display:flex;justify-content:space-between;align-items:center}
.brhead b{font-size:22px;color:var(--tx)}
.brbar{position:relative;height:10px;border-radius:6px;background:var(--line);margin:8px 0}
.brbar span{display:block;height:100%;border-radius:6px;transition:width .25s,background .25s;width:0}
.brbar i{position:absolute;top:-3px;width:2px;height:16px;background:#fff;opacity:.6}
.food{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.food div{flex:1}
.food b{font-size:14px;font-weight:600;color:var(--tx)}
.food small{display:block;color:var(--mut);font-size:12px}
.food .num{width:22px;text-align:center;font-size:18px;color:var(--tx)}
.qb{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-size:18px;cursor:pointer}
.effc{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,var(--bluebg),var(--card));border:1px solid var(--bluebd);border-radius:16px;padding:14px;margin-top:16px}
.effc small{display:block;color:var(--mut);font-size:11px}
.effc>div{flex:none}
.effc b{font-size:36px;color:var(--wu);line-height:1;white-space:nowrap}
.effc p{font-size:13px;color:var(--tx2)}
.outfit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.outfit div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.outfit span{font-size:22px}
.outfit small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:4px}
.outfit b{font-size:13.5px;font-weight:600}
.rtl{position:relative;padding-left:4px}
.rte{display:flex;gap:10px;align-items:flex-start;padding:8px 0;position:relative}
.rte>b{width:52px;font-size:18px;color:var(--mut);flex:none;padding-top:2px}
.rte>span{width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none;font-size:15px;z-index:1}
.rte div b{display:block;font-size:14.5px}
.rte div small{color:var(--mut);font-size:12.5px}
.rte:not(:last-child):after{content:"";position:absolute;left:82px;top:40px;bottom:-8px;width:2px;background:var(--line)}
.rte.st>b{color:var(--acct)}
.rte.st>span{background:var(--acc);border-color:var(--acc)}
.ckg small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:14px 0 6px;font-weight:600}
.cki{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer;font-size:14px}
.cki i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:transparent;flex:none}
.cki.on{color:var(--mut);text-decoration:line-through}
.cki.on i{background:var(--acc);border-color:var(--acc);color:#0b0d10}
.light{display:flex;gap:12px;border-radius:16px;padding:14px;margin:16px 0 10px;border:1px solid}
.light>span{font-size:26px}
.light b{font-size:17px}
.light p{font-size:13.5px;color:var(--tx2);margin-top:3px}
.light.g{background:var(--grnbg);border-color:var(--grnbd)}.light.g b{color:var(--easy)}
.light.y{background:var(--warnbg);border-color:var(--warnbd)}.light.y b{color:var(--warn)}
.light.r{background:var(--redbg);border-color:var(--redbd)}.light.r b{color:var(--red)}
.readyc{display:flex;gap:14px;align-items:center;border-radius:16px;padding:14px;margin-top:16px;border:1px solid var(--line);background:var(--card)}
.readyc.g{color:var(--easy)}.readyc.y{color:var(--warn)}.readyc.r{color:var(--red)}
.readyc p{color:var(--tx2);font-size:13.5px;margin-top:2px}
.readyc small{color:var(--mut);font-size:12px;display:block;margin-top:6px}
.readyc small b{color:var(--tx)}
.rring{position:relative;width:76px;height:76px;flex:none}
.rring svg{width:100%;height:100%}
.rring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:var(--tx)}
.rpeo{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--rc);border-radius:14px;padding:12px 14px;margin-top:6px}
.rpeo b{font-size:40px;color:var(--rc);line-height:1}
.rpeo p{font-size:13.5px;color:var(--tx2)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.keys div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.keys b{color:#2dd4bf;font-size:14px}
.keys p{font-size:12.5px;color:var(--tx2);margin-top:3px}
.metro{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;position:relative}
.mbig b{font-size:54px;line-height:1;display:block;color:#2dd4bf}
.mbig small{color:var(--mut);font-size:12px}
.mdot{width:14px;height:14px;border-radius:50%;background:var(--track);margin:10px auto;transition:transform .08s}
.mdot.f{background:#2dd4bf;transform:scale(1.6)}
.exc summary .ic{background:var(--card2);color:var(--str);font-size:15px}
.exl{margin:10px 0}
.exl small,.vars small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--easy);font-weight:700;margin-bottom:4px}
.exl.bad small{color:var(--red)}
.exl ol,.exl ul{padding-left:18px}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vars div{background:var(--card2);border-radius:12px;padding:10px}
.vars div:last-child small{color:var(--tempo)}
.vars b{font-size:13px;color:var(--tx)}
.art h4{font-size:16px;margin:18px 0 6px}
.art ul{padding-left:18px;color:var(--tx2);font-size:14px}
.art li{margin-bottom:6px}
.keyb{background:linear-gradient(120deg,var(--accbg),var(--card));border:1px solid var(--accbd);border-radius:14px;padding:12px 14px;font-size:14px}
.keyb small{display:block;color:var(--acct);font-weight:800;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.gterm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:6px}
.gterm b{font-size:14.5px}
.gterm p{font-size:13px;color:var(--tx2);margin-top:2px}


.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row3 .inp{padding:10px 6px;font-size:13.5px;min-width:0}
.calsec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.calh{display:flex;gap:10px;align-items:flex-start}
.calh>span{font-size:22px}
.calh b{display:block;font-size:15px}
.calh small{color:var(--mut);font-size:12.5px}
.calrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.calrow .dd{width:38px}
.calrow .dd b{font-size:20px}
.calrow .t{font-size:14px}
.calrow.on .t{color:var(--mut)}
.calrow a.tg{text-decoration:none;white-space:nowrap;padding:7px 11px}
.steps2{padding-left:20px;margin:12px 0 6px;color:var(--tx2);font-size:13.5px}
.steps2 li{margin-bottom:4px}
.h2row{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 10px}
.h2row h2{margin:0}
.pill.sm{padding:6px 11px;font-size:12px}


.feels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.feel{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:10px 2px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel span{font-size:26px;filter:grayscale(.6);opacity:.7}
.feel.on{border-color:var(--acc);background:var(--accbg);color:var(--acct)}
.feel.on span{filter:none;opacity:1}
.tg.bad.on{border-color:var(--red);color:var(--red);background:var(--redbg)}
textarea.inp{resize:vertical;font-family:var(--f)}
.lnk{background:none;border:0;color:var(--acct);font-weight:700;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.adapt{display:flex;gap:12px;border-radius:18px;padding:14px;margin-top:14px;border:1px solid var(--line);background:var(--card)}
.adapt>span{font-size:24px}
.adapt b{font-size:15px}
.adapt p{font-size:13px;color:var(--tx2);margin-top:2px}
.adapt.g{background:var(--grnbg);border-color:var(--grnbd)}.adapt.g b{color:var(--easy)}
.adapt.y{background:var(--warnbg);border-color:var(--warnbd)}.adapt.y b{color:var(--warn)}
.adapt.r{background:var(--redbg);border-color:var(--redbd)}.adapt.r b{color:var(--red)}
.adapt .tg{padding:7px 11px;font-size:12px}
.adjc{display:inline-block;font-size:10.5px;font-weight:800;color:var(--wu);background:var(--bluebg);border:1px solid var(--bluebd);border-radius:999px;padding:1px 6px;vertical-align:middle}
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 12px}
.lstats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}
.lstats b{font-size:24px;display:block;line-height:1.1}
.lstats small{color:var(--mut);font-size:11px}
.vol .col .vv{font-style:normal;font-size:10px;color:var(--mut);margin-bottom:3px;min-height:12px}
.lentry{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.lentry .lf{font-size:26px;width:36px;text-align:center}
.lentry .li{flex:1;min-width:0}
.lentry .t{font-weight:600;font-size:14.5px}
.lentry .s{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lentry .lr{text-align:right;flex:none}
.lentry .lr b{display:block;font-size:18px;color:var(--acct)}
.lentry .lr small{color:var(--mut);font-size:11.5px}
.xt{font-size:10px;font-weight:700;color:var(--mob);background:var(--card2);border-radius:999px;padding:1px 6px;vertical-align:middle}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--accbg);color:var(--acct);border:1px solid var(--accbd);padding:10px 16px;border-radius:999px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:80;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}


.motiv{display:flex;gap:8px;margin-top:12px}
.mchip{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px;color:var(--mut);font-size:12px;cursor:pointer}
.mchip b{color:var(--tx);font-size:17px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:12.5px;padding:9px 4px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--acc);color:#0b0d10}
.streak{display:flex;align-items:center;gap:12px;margin-top:14px;border-radius:18px;padding:14px;border:1px solid var(--orbd);background:radial-gradient(80% 120% at 0% 50%,rgba(251,146,60,.2),transparent 70%),var(--card)}
.flame{font-size:40px;animation:flick 1.6s ease-in-out infinite}
.flame.cold{filter:grayscale(1);opacity:.5;animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.sinfo{flex:1}
.sinfo b{font-size:34px;line-height:1;color:var(--tempo);margin-right:6px}
.sinfo span{font-weight:600}
.sinfo small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sdots{display:flex;gap:4px;flex-wrap:wrap;max-width:70px;justify-content:flex-end}
.sdots i{width:12px;height:12px;border-radius:4px;background:var(--track)}
.sdots i.on{background:var(--tempo)}
.sdots i.miss{background:#3a1d22}
.sdots i.td{border:1.5px dashed var(--tempo);background:none}
.lstats .of{font-size:14px;color:var(--mut)}
.chs{display:flex;gap:4px}
.chs button{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer}
.chs button.on{color:#0b0d10;background:var(--acc);border-color:var(--acc)}
.vol .cap{align-items:center}
.pair{display:flex;gap:2px;align-items:flex-end;width:100%;max-width:30px;justify-content:center}
.pair span{width:50%;border-radius:4px 4px 2px 2px}
.pair .ghost{background:var(--track)}
.pair .fill{background:var(--acc)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recs div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.recs span{font-size:18px}
.recs b{display:block;font-size:22px;margin-top:4px}
.recs small{color:var(--mut);font-size:11.5px}
.ftrend{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.ftrend div{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:46px}
.ftrend span{font-size:22px;display:block}
.ftrend small{color:var(--mut);font-size:10.5px}
.brow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.brow .bi{font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.brow div{flex:1;min-width:0}
.brow b{font-size:14.5px}
.brow small{display:block;color:var(--mut);font-size:12px}
.brow em{font-style:normal;font-weight:700;color:var(--acct);font-size:15px;white-space:nowrap}
.bp{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bp i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px 10px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.badge .bi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--card2);filter:grayscale(1);opacity:.6}
.badge b{font-size:12px;line-height:1.2;color:var(--mut)}
.badge small{font-size:10px;color:var(--acct);font-weight:700}
.badge .bp{width:80%;margin-top:2px}
.badge.ok{border-color:var(--accbd);background:radial-gradient(90% 70% at 50% 0%,rgba(212,255,58,.12),transparent 70%),var(--card)}
.badge.ok .bi{filter:none;opacity:1;background:var(--accbg);box-shadow:0 0 0 2px var(--accbd)}
.badge.ok b{color:var(--tx)}
#cele{position:fixed;inset:0;z-index:95;background:rgba(5,6,8,.78);display:none;align-items:center;justify-content:center;overflow:hidden}
#cele.on{display:flex}
#cele .conf i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.cbox{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:26px 22px;text-align:center;width:min(86vw,340px);display:flex;flex-direction:column;align-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.cbadge{width:96px;height:96px;border-radius:50%;background:var(--accbg);box-shadow:0 0 0 3px var(--acc),0 0 40px rgba(212,255,58,.35);display:grid;place-items:center;font-size:48px;margin-bottom:12px}
.cbox small{color:var(--acct);font-weight:800;text-transform:uppercase;letter-spacing:1.4px;font-size:11px}
.cbox h3{font-size:26px;margin:4px 0}
.cbox p{color:var(--tx2);font-size:14px;margin-bottom:16px}
.cbox .btn{width:100%;flex:none}


.gb{transition:height .55s cubic-bezier(.2,.8,.2,1)}
.vol .col{position:relative}
.vol .col.on small{background:var(--acc);color:#0b0d10;border-radius:6px;padding:0 5px}
.wdet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:-2px}
.wdh{display:flex;align-items:center;gap:10px;text-align:center}
.wdh div{flex:1}
.wdh b{display:block;font-size:15px}
.wdh small{color:var(--mut);font-size:12px}
.wnav{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-size:20px;cursor:pointer}
.wnav:disabled{opacity:.3}
.wmini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;text-align:center}
.wmini b{font-size:20px;display:block;line-height:1.1}
.wmini small{font-size:10.5px;color:var(--mut)}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wday{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 0;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.wday small{font-size:9.5px;text-transform:uppercase;font-weight:700}
.wday span{font-size:16px;line-height:1.2}
.wday.done{border-color:var(--fc,var(--acc));background:color-mix(in srgb,var(--fc,var(--acc)) 14%,var(--card2));color:var(--acct)}
.wday.miss{background:var(--redbg);border-color:var(--redbd);color:var(--red)}
.wday.today{border:1.5px dashed var(--acc);color:var(--acct)}
.wday.rest{opacity:.45}
.wlogs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.wlogs .tg{font-size:12px;padding:6px 10px}
.heat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.hrow{display:grid;grid-template-columns:26px repeat(7,1fr);gap:5px;margin-bottom:5px;align-items:center}
.hrow>span{font-size:10px;color:var(--mut);font-weight:700}
.hh i{font-style:normal;text-align:center;font-size:10px;color:var(--mut);font-weight:700}
.hc{aspect-ratio:1;border-radius:8px;border:0;background:var(--card2);color:var(--mut2);font-size:11px;font-weight:700;cursor:pointer;display:grid;place-items:center;transition:transform .15s;padding:0}
.hc:active{transform:scale(.9)}
.hc.out{background:transparent}
.hc.plan,.hc.today{background:transparent;box-shadow:inset 0 0 0 1.5px var(--tc,#8b93a1);color:var(--mut)}
.hc.today{box-shadow:inset 0 0 0 2px var(--acc);color:var(--acct)}
.hc.done{background:var(--fc,var(--acc));color:#0b0d10}
.hc.miss{background:var(--redbd);color:var(--red)}
.hc.race{font-size:14px}
.hc.sel{outline:2px solid #fff;outline-offset:2px}
.hinfo{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px;animation:fade .2s}
.hinfo div{flex:1;min-width:0}
.hinfo b{display:block;font-size:13.5px}
.hinfo small{color:var(--mut);font-size:12px}
.rec{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--tx);cursor:pointer}

.rec b{display:block;font-size:22px;margin-top:4px}
.rec small{color:var(--mut);font-size:11.5px}
.rec em{position:absolute;right:12px;top:10px;font-style:normal;color:var(--mut);font-size:18px}
.ftrend2{position:relative;height:96px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 0 22px}
.fline{position:absolute;left:0;top:6px;width:100%;height:70px}
.ftrend2 button{position:absolute;transform:translateX(-50%);margin-top:6px;background:none;border:0;font-size:20px;cursor:pointer;padding:0;line-height:1}
.fax{position:absolute;left:10px;right:10px;bottom:4px;display:flex;justify-content:space-between;font-size:10px;color:var(--mut)}

.brow{width:100%;text-align:left;color:var(--tx);cursor:pointer}
.bfil{display:flex;gap:6px;margin:14px 0 4px;flex-wrap:wrap}

.badge .bi{position:relative;width:60px;height:60px;filter:none;opacity:1;background:none}

.bsheet{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}

.pl .ctr{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:18px}
.pl .cb{width:58px;height:58px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--tx);font-size:20px;cursor:pointer;display:grid;place-items:center}

.pl .fin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.pl .fin .ok{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#0b0d10;display:grid;place-items:center;font-size:48px;font-weight:800;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.pl .fin h3{font-size:28px}
.pl .conf{color:var(--red);font-size:12px;text-align:right;min-height:16px;margin-top:4px}
</style>
</head>

<script>
/* ================= KONSTANTE ================= */
const K = {
  U:{n:"Ogrevanje",c:"var(--wu)",e:"Zelo lahko, postopno"},
  C:{n:"Ohlajanje",c:"var(--wu)",e:"Hoja ali zelo počasen kas"},
  W:{n:"Hoja",c:"var(--walk)",e:"Hitra, aktivna hoja"},
  E:{n:"Lahek tek",c:"var(--easy)",e:"RPE 3–4 · pogovarjaš se v celih stavkih"},
  T:{n:"Živahno",c:"var(--tempo)",e:"RPE 6–7 · govoriš le še kratke besede"},
  S:{n:"Pospešek",c:"var(--fast)",e:"RPE 8 · hitro, a sproščeno – ne šprint"},
  R:{n:"Tekmovalni tempo",c:"var(--acc)",e:"RPE 5–6 · enakomerno in nadzorovano"},
  X:{n:"Moč",c:"var(--str)",e:"Kontrolirano, pravilna tehnika"},
  M:{n:"Mobilnost",c:"var(--mob)",e:"Mirno, brez bolečine"},
  D:{n:"Vaja",c:"#f472b6",e:"Dinamično, nadzorovano"},
  P:{n:"Odmor",c:"var(--rest)",e:"Globoko dihaj, pripravi se"}
};
const T = {
  easy:{n:"Lahek tek",c:"var(--easy)"}, interval:{n:"Kakovostni trening",c:"var(--tempo)"},
  long:{n:"Dolgi tek",c:"#2dd4bf"}, strength:{n:"Moč",c:"var(--str)"},
  rest:{n:"Počitek",c:"var(--rest)"}, sharpen:{n:"Generalka",c:"#facc15"},
  shake:{n:"Razgibavanje",c:"var(--mob)"}, race:{n:"Tekma",c:"var(--acc)"}
};
const DIST = [5,10,12,15,18,21.1,25,30,42.2];
const DLAB = d => d===21.1 ? "Polmaraton" : d===42.2 ? "Maraton" : d+" km";
const DSHORT = d => comma(d);
const LEVELS = [
  {n:"Popoln začetnik", d:"Ne tečem ali zmorem le nekaj minut teka."},
  {n:"Začetnik", d:"Zmorem 10–25 minut teka, občasno s hojo."},
  {n:"Rekreativec", d:"Redno tečem 30–45 minut, 2–3× na teden."},
  {n:"Izkušen", d:"Tečem 4× ali več na teden, 60 minut ni problem."}
];
/* najdaljši tek (min) na vrhuncu priprav */
const PEAK = {5:[30,35,40,45],10:[55,60,65,75],12:[65,70,75,85],15:[80,85,90,100],18:[95,100,105,115],21.1:[105,110,120,130],25:[115,120,130,140],30:[125,135,145,155],42.2:[150,160,170,180]};
/* začetni dolgi tek (min, vključno s hojo) */
const START_LONG = [25,40,45,60];
/* priporočeno št. tednov */
const REC = {5:[8,6,4,3],10:[12,8,6,5],12:[14,10,7,6],15:[16,12,9,7],18:[18,14,10,8],21.1:[20,16,12,10],25:[22,18,14,11],30:[24,20,16,12],42.2:[26,22,18,14]};
/* razpored po dnevih (0=ned … 6=sob) */
const TPL = {
  3:{2:"Q",3:"STR",4:"E",0:"L"},
  4:{2:"Q",3:"STR",4:"E",5:"ES",0:"L"},
  5:{1:"STR",2:"Q",3:"E",4:"ES",6:"ESh",0:"L"}
};
const PH = {
  base:{n:"Osnova",f:"Gradiš aerobno osnovo. Večina teka je lahkotna – hitrost še ni pomembna."},
  build:{n:"Gradnja",f:"Dolgi teki se daljšajo, dodani so intervali in tempo teki."},
  peak:{n:"Vrhunec",f:"Najzahtevnejši teden priprav in prvi tek v tekmovalnem tempu."},
  down:{n:"Lažji teden",f:"Manj obsega, da telo predela trening in postane močnejše."},
  taper:{n:"Zaključek",f:"Obseg se zmanjša, intenzivnost ostane. Noge se začnejo spočivati."},
  race:{n:"Teden tekme",f:"Malo in lahkotno. Prihrani energijo za dan tekme."}
};
const STRENGTH = [["Počepi","12–15×"],["Izpadni koraki (na nogo)","10×"],["Glutealni most","15×"],["Dvig na prste (meča)","15×"],["Deska (plank)","30–40 s"],["Stranska deska (na stran)","20–30 s"]];
const DN = ["ned","pon","tor","sre","čet","pet","sob"];
const DNF = ["Nedelja","Ponedeljek","Torek","Sreda","Četrtek","Petek","Sobota"];
const MN = ["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
const DAY = 864e5;

/* ================= POMOŽNE ================= */
const sec = s => s/60;
const rep = (n,...items) => ({rep:n,items});
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const r5 = x => Math.max(5,Math.round(x/5)*5);
const comma = x => String(x).replace(".",",");
function dateOf(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function todayDate(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function iso(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0")}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function dayDiff(a,b){return Math.round((b-a)/DAY)}
function fdate(s){const d=dateOf(s);return d.getDate()+". "+MN[d.getMonth()]+" "+d.getFullYear()}
function flat(s){const out=[];s.forEach(x=>{if(x.rep){for(let i=0;i<x.rep;i++)x.items.forEach(y=>out.push(y))}else out.push(x)});return out}
function total(s){return flat(s).reduce((a,b)=>a+b[1],0)}
function runMin(s){return flat(s).filter(x=>"ERTS".includes(x[0])).reduce((a,b)=>a+b[1],0)}
function fmt(m){const s=Math.round(m*60);if(s<60)return s+" s";if(s%60===0)return (s/60)+" min";return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+" min"}
function fmtPace(p){let m=Math.floor(p),s=Math.round((p-m)*60);if(s===60){m++;s=0}return m+":"+String(s).padStart(2,"0")}
function fmtHMS(min){const t=Math.round(min*60),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"):m+":"+String(s).padStart(2,"0")}
function parseTime(str){if(!str)return null;const p=str.trim().split(/[:.]/).map(Number);if(p.some(isNaN)||p.length<2||p.length>3)return null;const s=p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+p[1];return s>0?s:null}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ================= SHRANJEVANJE (profili) ================= */
const RAW={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEVICE_KEYS=["korak_snd","korak_voice","korak_theme"];
const THEME={mode:(()=>{try{return JSON.parse(localStorage.getItem("korak_theme"))||"auto"}catch(e){return "auto"}})()};
function applyTheme(){let m=THEME.mode;if(m==="auto"){try{m=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){m="dark"}}document.documentElement.dataset.theme=m;const b=document.getElementById("thbtn");if(b)b.textContent=THEME.mode==="auto"?"🌓":m==="light"?"☀️":"🌙"}
function setTheme(m){THEME.mode=m;try{localStorage.setItem("korak_theme",JSON.stringify(m))}catch(e){}applyTheme();if(typeof PROFOPEN!=="undefined"&&PROFOPEN)openProfiles()}
applyTheme();

var CLOUD={on:false,status:"local",db:null,uid:null,col:null,unsub:null,timer:null,chain:Promise.resolve(),warned:false};

let GOALS = sget("korak_goals",[]), ACTIVE = sget("korak_active",null), DONE = sget("korak_done",{});
if(ACTIVE&&!GOALS.some(g=>g.id===ACTIVE))ACTIVE=GOALS[0]?GOALS[0].id:null;
function saveAll(){sset("korak_goals",GOALS);sset("korak_active",ACTIVE);sset("korak_done",DONE)}
const goal = () => GOALS.find(g=>g.id===ACTIVE)||GOALS[0]||null;
const isDone = (g,d) => !!DONE[g.id+"|"+d];

/* ================= TEMPO ================= */
function racePace(g){ return g.target ? g.target/60/g.dist : [8.5,7.25,6.0,5.25][g.lvl]*(1+0.04*Math.log2(g.dist/5)); }
function raceDur(g){ return racePace(g)*g.dist; }
function paces(g){
  const rp = racePace(g);
  return { E:[rp*1.15,rp*1.28], R:[rp,rp], T: g.dist>5?[rp*0.95,rp*0.98]:[rp*1.03,rp*1.07], easy: rp*1.2, rp };
}
const showPace = g => g.lvl>=2 || !!g.target;
function paceStr(g,k){const p=paces(g)[k];if(!p)return "";return p[0]===p[1]?fmtPace(p[0])+" /km":fmtPace(p[0])+"–"+fmtPace(p[1])+" /km"}
function kmOf(s,g){const p=paces(g);return flat(s).reduce((a,x)=>a+(x[0]==="E"?x[1]/p.easy:x[0]==="R"?x[1]/p.rp:x[0]==="T"?x[1]/(p.T[0]):0),0)}
function km1(x){return comma(Math.round(x*2)/2)}

/* ================= GENERATOR ================= */
function generate(g){
  const D=g.dist, L=g.lvl, dpw=g.dpw;
  const race=dateOf(g.race);
  let start=dateOf(g.start);
  const raceMon=monday(race);
  let firstMon=monday(start);
  let W=Math.round(dayDiff(firstMon,raceMon)/7)+1;
  let capped=false;
  const maxW = D>=25?26:20;
  if(W>maxW){firstMon=addDays(raceMon,-(maxW-1)*7);start=firstMon;W=maxW;capped=true}
  const TW = D>=25&&W>=10?2:(D>=15&&W>=6?1:0);
  const P = Math.max(0,W-1-TW);
  const peakT = PEAK[D][L];
  const st = Math.min(START_LONG[L], peakT*0.8);
  const cap = P<=3?1.3:1.15;
  const longs=[];
  for(let i=0;i<P;i++){const t=P>1?i/(P-1):1;let v=st+(peakT-st)*t;v=Math.min(v,st*Math.pow(cap,i));longs.push(v)}
  const isDown = i => P>=6 && i%4===3 && i<P-1;
  const peakA = longs.length?longs[longs.length-1]:st;
  const finalSeg = L===0?Math.min(20,4+P):L===1?Math.min(30,8+2*P):0;
  const startSeg = L===0?1:3;
  const rd = raceDur(g);

  const weeks=[];
  for(let k=0;k<W;k++){
    const wtr=W-1-k; let ph,t=1,lg=peakA;
    if(wtr===0){ph="race";lg=peakA*0.6}
    else if(wtr<=TW){ph="taper";lg=peakA*(0.55+0.1*wtr)}
    else {t=P>1?k/(P-1):1;lg=longs[k]*(isDown(k)?0.8:1);ph=isDown(k)?"down":k===P-1?"peak":t<0.35?"base":"build"}
    const seg = L>=2?0:Math.round(startSeg+(finalSeg-startSeg)*t);
    const walk = L===0&&t<0.5?1.5:1;
    weeks.push({k,ph,t,long:lg,mon:iso(addDays(firstMon,k*7)),days:[],c:{L,D,g,seg,walk,t,ph,i:k,rd,finalSeg}});
  }
  for(let d=new Date(start); d<=race; d=addDays(d,1)){
    const k=Math.round(dayDiff(firstMon,monday(d))/7), wk=weeks[k], off=dayDiff(d,race);
    let day = off<=6 ? raceWeekDay(off,wk,dpw,peakA) : weekDay(d.getDay(),wk,dpw);
    if(day.t==="rest" && iso(d)===iso(start) && off>6) day=REST("Prvi dan načrta. Pripravi opremo, preglej teden – jutri začneš.");
    day.d=iso(d); day.w=k+1; wk.days.push(day);
  }
  const days=[].concat(...weeks.map(w=>w.days));
  return {weeks,days,W,P,peakA,peakT,capped,rd,start:iso(start),rec:REC[D][L]};
}

const wu=(L,m=5)=>["U",m,L<2?"Hitra hoja":"Hoja + lahek kas"];
const cd=(L,m=5)=>["C",m,L<2?"Hoja":"Lahek kas + hoja"];
function easyLabel(c,m){return c.L>=2?`Lahek tek (≈ ${km1(m/paces(c.g).easy)} km)`:"Lahek tek"}
function block(total,c){
  if(c.L>=2||c.seg>=total) return [["E",total,easyLabel(c,total)]];
  const n=Math.max(1,Math.round(total/(c.seg+c.walk)));
  return [rep(n,["E",c.seg,"Lahek tek"],["W",c.walk,"Hoja"])];
}
function strides(c,n){return rep(n,["S",sec(20),"Pospešek"],["W",c.L<2?1.5:sec(70),c.L<2?"Hoja":"Hoja / kas"])}
const REST = (why)=>({t:"rest",title:"Počitek",why:why||"Telo se krepi med počitkom, ne med treningom. Neobvezno: 20–30 min sprehoda ali razgibavanja."});

function strengthDay(c,light){
  const n = light?2:(c.L<2?2:3);
  return {t:"strength",title:light?"Lahka moč + mobilnost":"Moč + mobilnost",
    why:light?"Le dva lahka kroga – brez mišične bolečine pred tekmo.":"Močnejše noge, boki in trup pomenijo boljšo tehniko in manj poškodb.",
    s:circuitSegs(n,5),str:n};
}

function quality(c){
  const L=c.L, rec = L<2?["W",2,"Hoja"]:["E",2,"Lahek kas"];
  if(c.ph==="taper") return {t:"interval",title:"Tekmovalni tempo",why:"Kratek opomnik tekmovalnega tempa – ohranja ostrino brez utrujanja.",
    s:[wu(L,10),rep(2,["R",L<2?5:8,"Tekmovalni tempo"],rec),strides(c,4),cd(L)]};
  if(c.ph==="base"||c.ph==="down"){
    const n = c.ph==="down"?4:clamp(4+c.i,4,8);
    return {t:"interval",title:"Fartlek",why:"Igra s tempom: kratki živahni odseki naučijo telo hitrejšega gibanja brez velikega napora.",
      s:[wu(L,10),rep(n,["T",1,"Živahno"],L<2?["W",2,"Hoja"]:["E",2,"Lahek kas"]),cd(L)]};
  }
  if(c.ph==="build"){
    const bt=clamp((c.t-0.35)/0.55,0,1);
    if(c.i%2===0){
      const len = L===0?2:c.D<=10?3:c.D<=15?4:5, n=Math.round(4+2*bt);
      return {t:"interval",title:"Intervali",why:"Odseki nad tekmovalnim tempom dvignejo tvojo zmogljivost – na tekmi se bo tempo zdel lažji.",
        s:[wu(L,10),rep(n,["T",len,"Hitreje"],rec),cd(L,L<2?5:10)]};
    }
    if(L>=2){const m=r5(10+(c.D>=15?20:15)*bt);
      return {t:"interval",title:"Tempo tek",why:"Daljši neprekinjen odsek v 'udobno napornem' tempu – ključni trening za vzdržljivost v tempu.",
        s:[wu(L,10),["T",m,"Tempo tek"],cd(L,10)]};}
    return {t:"interval",title:"Tempo odseki",why:"Daljši živahni odseki s hojo vmes – telo se navaja na vzdržen napor.",
      s:[wu(L,10),rep(2,["T",Math.round(4+4*bt),"Živahen tek"],["W",2,"Hoja"]),cd(L)]};
  }
  // peak
  if(L>=2){const m=r5(clamp(c.rd*0.4,10,35));
    return {t:"interval",title:"Tekmovalni tempo",why:"Tek v tempu, ki ga načrtuješ na tekmi. Občutek si zapomni.",
      s:[wu(L,10),["R",m,"Tekmovalni tempo"],cd(L,10)]};}
  return {t:"interval",title:"Tekmovalni tempo",why:"Odseki v tempu, ki ga načrtuješ na tekmi, s hojo vmes.",
    s:[wu(L,10),rep(3,["R",6,"Tekmovalni tempo"],["W",2,"Hoja"]),cd(L)]};
}

function weekDay(dow,wk,dpw){
  const c=wk.c, slot=TPL[dpw][dow], L=c.L;
  if(!slot) return REST(dow===6?"Pred jutrišnjim dolgim tekom noge spočiješ.":dow===1?"Dan po dolgem teku. Raztezanje ali sprehod sta dovolj.":null);
  if(slot==="STR") return strengthDay(c,wk.ph==="taper");
  if(slot==="Q") return quality(c);
  if(slot==="L"){
    const m=r5(wk.long);
    const peak = wk.ph==="peak";
    return {t:"long",title:peak?"Najdaljši tek":"Dolgi tek",
      why:peak?"Vrhunec priprav. Ko to opraviš, veš, da zmoreš. Tempo: počasi in enakomerno.":"Najpomembnejši trening tedna: podaljšuješ čas na nogah. Počasneje, kot misliš, da moraš."+(c.D>=15&&m>=60?" Preizkusi pijačo ali gel, ki ju boš uporabil na tekmi.":""),
      s:[wu(L),...block(m,c),cd(L)]};
  }
  const f = slot==="E"?0.6:slot==="ES"?0.5:0.45;
  const m = r5(clamp(wk.long*f,15,slot==="E"?(c.D>=25?75:60):(c.D>=25?55:45)));
  if(slot==="ES") return {t:"easy",title:"Lahek tek + pospeški",why:"Kratki pospeški izboljšajo tekaško tehniko in te pripravijo na hitrejši tempo – brez utrujanja.",
    s:[wu(L),...block(m,c),strides(c,L<2?4:6),cd(L)]};
  return {t:"easy",title:slot==="ESh"?"Kratek lahek tek":"Lahek tek",why:"Gradiš aerobno osnovo – srce, pljuča in mišice se navajajo na trajanje.",
    s:[wu(L),...block(m,c),cd(L)]};
}

function raceWeekDay(off,wk,dpw,peakA){
  const c=Object.assign({},wk.c,{ph:"race"}), L=c.L, g=c.g;
  if(off===0){
    const rd=c.rd;
    if(L>=2){
      const a=Math.round(rd*0.3), b=Math.round(rd*0.4), z=Math.max(1,Math.round(rd-a-b));
      return {t:"race",title:`TEKMA · ${DLAB(c.D)}`,why:"Dan, za katerega si treniral. Začni počasneje, kot ti narekujejo noge – energijo prihrani za drugi del.",
        s:[["U",10,"Lahek kas + 3 pospeški"],["R",a,"Prva tretjina: zadržano"],["R",b,"Sredina: enakomeren ritem"],["T",z,"Zadnja tretjina: kar ostane"]],
        plan:`Ciljni tempo ≈ <b>${fmtPace(racePace(g))} /km</b>, končni čas ≈ <b>${fmtHMS(rd)}</b>. Prva 2 km namerno počasneje od občutka. Na sredini najdi ritem, ki ga zdržiš, od zadnje tretjine naprej pa lahko stopnjuješ.${c.D>=15?" Pij na vsaki okrepčevalnici, gel ali energijski napitek po 45–60 minutah.":" Pri okrepčevalnici popij nekaj požirkov."}`, splits:true};
    }
    const r = L===0?clamp(c.finalSeg,2,5):clamp(c.finalSeg,4,9);
    const n = Math.max(1,Math.round(rd/(r+1)));
    return {t:"race",title:`TEKMA · ${DLAB(c.D)}`,why:"Dan, za katerega si treniral. Cilj je priti do cilja nasmejan – ne čas.",
      s:[wu(L,10),rep(n,["R",r,"Tek v udobnem tempu"],["W",1,"Hoja (tudi pri okrepčevalnici)"])],
      plan:`Strategija <b>${r}/1</b>: ${r} min teka, 1 min hoje – od starta naprej, tudi če se počutiš odlično. Tako boš do cilja prišel v približno <b>${fmtHMS(rd*0.92)}–${fmtHMS(rd*1.08)}</b>. Če se v drugi polovici počutiš močno, lahko hojo skrajšaš na 30 s.`, splits:!!g.target};
  }
  if(off===1){
    const s = L>=2?[["E",15,"Zelo lahek tek"],rep(4,["S",sec(15),"Kratek pospešek"],["W",sec(75),"Hoja / kas"]),["C",3,"Hoja"]]
                  :[wu(L),rep(3,["E",3,"Zelo lahek tek"],["W",1,"Hoja"]),rep(3,["S",sec(15),"Kratek pospešek"],["W",1.5,"Hoja"])];
    return {t:"shake",title:"Razgibavanje",why:"Kratko prebujenje nog dan pred tekmo. Nič naporno. Prevzem štartne številke in priprava opreme.",s};
  }
  if(off===3){
    const s = L>=2?[wu(L,10),["R",r5(clamp(c.rd*0.25,8,20)),"Tekmovalni tempo"],cd(L,10)]
                  :[wu(L,10),rep(2,["R",L===0?5:8,"Tekmovalni tempo"],["W",2,"Hoja"]),cd(L)];
    return {t:"sharpen",title:"Generalka",why:"Preizkusiš tekmovalni tempo in opremo, ki jo boš nosil na tekmi (čevlji, oblačila, ura).",s};
  }
  if(off===5){
    const m=r5(clamp(peakA*0.4,15,35));
    return {t:"easy",title:"Lahek tek + pospeški",why:"Krajši tek ohranja formo, pospeški pa ohranjajo noge 'žive'.",s:[wu(L),...block(m,c),strides(c,L<2?4:6),cd(L)]};
  }
  if(off===6 && dpw>=4) return strengthDay(c,true);
  if(off===2) return REST("Najpomembnejša noč spanca je dve noči pred tekmo – nocoj.");
  return REST("Zaključni teden: manj je več.");
}

/* ================= STANJE ================= */
let PLAN=null, WEEK=1, PEND_DEL=null;
function rebuild(keep){const g=goal();PLAN=g?generate(g):null;if(PLAN)applyAdapt(g);const t=iso(todayDate());if(PLAN&&!(keep&&WEEK<=PLAN.W)){const d=PLAN.days.find(x=>x.d===t);WEEK=d?d.w:(t>PLAN.days[PLAN.days.length-1].d?PLAN.W:1)}}

/* ================= RENDER ================= */
function barHTML(s,h){
  const f=flat(s), tot=total(s), hgt={W:45,U:55,C:55,E:70,R:85,T:90,S:100,X:75,M:50};
  return `<div class="bar" ${h?`style="height:${h}px"`:""}>`+f.map(x=>`<span style="flex:${Math.max(x[1],0.35)/tot*100} 0 0;background:${K[x[0]].c};height:${h?100:hgt[x[0]]}%"></span>`).join("")+`</div>`;
}
function summary(s){return s.map(x=>x.rep&&x.items.length>3?`${x.rep}× krog (${x.items.filter(y=>y[0]!=="P").length} vaj)`:x.rep?`${x.rep}× (${x.items.map(y=>fmt(y[1])+" "+K[y[0]].n.toLowerCase()).join(" / ")})`:`${fmt(x[1])} ${K[x[0]].n.toLowerCase()}`).join(" · ")}
function progress(g,plan){const act=plan.days.filter(p=>p.t!=="rest");const dn=act.filter(p=>isDone(g,p.d)).length;return {dn,n:act.length,pct:act.length?Math.round(dn/act.length*100):0}}

function renderHeader(){
  const g=goal(), hero=document.getElementById("hero");
  document.getElementById("editBtn").style.display=g?"":"none";
  if(!g){hero.style.display="none";document.getElementById("hsub").textContent="Tekaški načrti";return}
  hero.style.display="";
  document.getElementById("hsub").textContent=`${LEVELS[g.lvl].n} · ${g.dpw}× na teden`;
  document.getElementById("hname").textContent=`${g.name} · ${DLAB(g.dist)}`;
  const diff=dayDiff(todayDate(),dateOf(g.race));
  document.getElementById("cd").textContent = diff>0?diff:(diff===0?"0":"✓");
  document.getElementById("cdl").textContent = diff>1?(diff===2?"dni do starta":"dni do starta"):diff===1?"dan – jutri je tekma!":diff===0?"Danes je tekma!":"Tekma opravljena";
  const p=progress(g,PLAN);
  document.getElementById("pc").textContent=p.pct+"%";
  document.getElementById("pcs").textContent=p.dn+"/"+p.n+" treningov";
  document.getElementById("rg").style.strokeDashoffset = 232.5*(1-p.pct/100);
}

function warnHTML(g){
  if(PLAN.W>=PLAN.rec && !PLAN.capped) return "";
  if(PLAN.capped) return `<div class="note"><b>Načrt se začne ${fdate(PLAN.start)}.</b> Do tekme je več kot ${PLAN.W} tednov – do takrat redno teci lahkotno 2–3× na teden.</div>`;
  return `<div class="note warn" style="margin-top:14px"><b>Kratek čas priprav.</b> Za ${DLAB(g.dist).toLowerCase()} na nivoju »${LEVELS[g.lvl].n}« priporočamo vsaj ${PLAN.rec} tednov, ti jih imaš ${PLAN.W}. Načrt je prilagojen varnemu napredku – cilj naj bo prijeten zaključek, ne čas.</div>`;
}

function renderToday(){
  const g=goal(), card=document.getElementById("todayCard");
  if(!g){
    document.getElementById("warnBox").innerHTML="";
    document.getElementById("todayLabel").textContent="Dobrodošel";
    card.innerHTML=`<div class="card"><span class="chip"><i style="background:var(--acc)"></i>Nov začetek</span><h3>Ustvari svoj tekaški načrt</h3><div class="meta" style="margin-top:6px">Izberi razdaljo od 5 km do maratona, svojo pripravljenost in datum tekme. Načrt se sestavi samodejno.</div><div class="cta"><button class="btn pri" data-newgoal>Začni</button></div></div>`;
    document.getElementById("nextList").innerHTML="";return;
  }
  document.getElementById("warnBox").innerHTML=warnHTML(g)+adaptCard(g);
  const t=iso(todayDate()), days=PLAN.days;
  let idx=days.findIndex(p=>p.d===t), label="Danes";
  if(idx<0){ if(t<days[0].d){idx=0;label="Prvi trening"} else {idx=days.length-1;label="Tekma"} }
  const p=days[idx], dt=dateOf(p.d);
  document.getElementById("todayLabel").textContent = label+" · "+DNF[dt.getDay()]+", "+dt.getDate()+". "+MN[dt.getMonth()];
  const dn=isDone(g,p.d);
  let h=`<div class="card today" data-open="${p.d}"><span class="chip"><i style="background:${T[p.t].c}"></i>${T[p.t].n} · teden ${p.w}</span><h3>${p.title}${p.adj?` <span class="adjc">${p.adj>0?"+":""}${p.adj} %</span>`:""}</h3>`;
  if(p.s){
    const km=showPace(g)&&p.t!=="strength"?kmOf(p.s,g):0;
    h+=`<div class="meta"><span><b class="num" style="font-size:18px">${Math.round(total(p.s))}</b> min skupaj</span>${p.t!=="strength"?`<span><b class="num" style="font-size:18px">${Math.round(runMin(p.s))}</b> min teka</span>`:""}${km?`<span><b class="num" style="font-size:18px">≈ ${km1(km)}</b> km</span>`:""}</div>${barHTML(p.s)}<div class="meta" style="margin-top:8px">${summary(p.s)}</div>`;
  } else h+=`<div class="meta" style="margin-top:6px">${p.why}</div>`;
  if(p.s) h+=`<div class="cta"><button class="btn pri" data-start="${p.d}">▶ Začni vodeni trening</button></div>`;
  h+=`<div class="cta" style="${p.s?"margin-top:10px":""}"><button class="btn sec" data-open="${p.d}">Podrobnosti</button>${p.t!=="rest"?`<button class="btn ${dn?"done":"sec"}" data-done="${p.d}">${dn?"✓ Opravljeno":"Označi opravljeno"}</button>`:""}</div></div>`;
  card.innerHTML=h;
  const nx=days.slice(idx+1).filter(x=>x.t!=="rest").slice(0,6);

function renderPlan(){

    PLAN.weeks.map((w,i)=>`<div class="col ${i+1===WEEK?"on":""} ${w.ph==="race"?"race":""}" data-w="${i+1}"><span style="height:${Math.max(6,vols[i]/mx*80)}px"></span><small>${PLAN.W>12?(i+1):"T"+(i+1)}</small></div>`).join("")+`</div>`;

  let run=0,n=0,dn=0,km=0;

  document.getElementById("wsum").innerHTML=`<div><b class="num">${n}</b><small>treningov</small></div><div><b class="num">${Math.round(run)}</b><small>min teka</small></div>${showPace(g)?`<div><b class="num">≈${Math.round(km)}</b><small>km</small></div>`:""}<div><b class="num" style="color:var(--acct)">${dn}/${n}</b><small>opravljeno</small></div>`;
  const t=iso(todayDate());

    const d=dateOf(p.d), rest=p.t==="rest";

      <div class="di"><div class="t" style="${rest?"color:var(--mut)":""}">${p.title}${LOG[g.id+"|"+p.d]?" "+FEEL[LOG[g.id+"|"+p.d].feel][0]:""}${p.adj?` <span class="adjc">${p.adj>0?"+":""}${p.adj} %</span>`:""}</div><div class="s">${p.s?Math.round(total(p.s))+" min · "+summary(p.s):"Aktivni odmor ali popoln počitek"}</div>${p.s?barHTML(p.s,6):""}</div>
      ${rest?"":`<button class="ck ${isDone(g,p.d)?"on":""}" data-done="${p.d}" aria-label="Opravljeno">✓</button>`}</div>`;

function renderGoals(){

    const pl=g.id===ACTIVE?PLAN:generate(g), p=progress(g,pl), act=g.id===ACTIVE, past=g.race<t;

function stepHTML(x,g){
  const p = showPace(g)&&"ERT".includes(x[0])?`<small class="p">≈ ${paceStr(g,x[0])}</small>`:"";
  return `<div class="step"><i style="background:${K[x[0]].c}"></i><div class="sn"><b>${x[2]}</b><small>${K[x[0]].e}</small>${p}</div><div class="sd num">${fmt(x[1])}</div></div>`;
}

function openDay(d){
  const g=goal(), p=PLAN.days.find(x=>x.d===d), dt=dateOf(d), dn=isDone(g,d);
  let h=`<div class="grab"></div><button class="close" data-close>✕</button><span class="chip"><i style="background:${T[p.t].c}"></i>${T[p.t].n}</span>
  <h3>${p.title}</h3><div class="meta">${DNF[dt.getDay()]}, ${dt.getDate()}. ${MN[dt.getMonth()]} · Teden ${p.w} · ${LEVELS[g.lvl].n}</div>`;
  if(p.s){
    const km=showPace(g)&&p.t!=="strength"?kmOf(p.s,g):0;
    h+=`<div class="stats"><div><b class="num">${Math.round(total(p.s))}</b><small>min skupaj</small></div>${p.t!=="strength"?`<div><b class="num">${Math.round(runMin(p.s))}</b><small>min teka</small></div>`:""}${km?`<div><b class="num">≈${km1(km)}</b><small>km</small></div>`:`<div><b class="num">${flat(p.s).length}</b><small>korakov</small></div>`}</div>`;
    h+=barHTML(p.s,40);
  }
  h+=`<div class="note" style="margin-top:14px"><b>Namen: </b>${p.why}</div>`;
  if(p.adj) h+=`<div class="note" style="border-color:var(--bluebd)"><b style="color:var(--wu)">Prilagojeno ${p.adj>0?"+":""}${p.adj} %</b> glede na tvoje zadnje vpise. ${PLAN.adapt?PLAN.adapt.t+".":""}</div>`;
  {const lg=LOG[g.id+"|"+d];if(lg)h+=`<div class="lentry" data-logedit="${g.id}|${d}" style="margin-bottom:10px"><div class="lf">${FEEL[lg.feel][0]}</div><div class="li"><div class="t">Tvoj vpis · ${FEEL[lg.feel][1]}</div><div class="s">${lg.note?esc(lg.note):"Tapni za urejanje"}</div></div><div class="lr">${lg.km?`<b class="num">${comma(lg.km)} km</b>`:""}${lg.min?`<small>${Math.round(lg.min)} min</small>`:""}</div></div>`;else if(dn)h+=`<button class="btn sec" style="width:100%;margin-bottom:10px" data-log="${d}">📝 Vpiši, kako je šlo</button>`;}
  if(p.plan) h+=`<div class="note" style="border-color:var(--accbd)"><b style="color:var(--acct)">Strategija za tekmo: </b>${p.plan}</div>`;
  if(p.splits){
    const rp=racePace(g), n=Math.floor(g.dist), marks=[];
    const step = g.dist>25?5:g.dist>12?3:g.dist>5?2:1;
    for(let k=step;k<n;k+=step)marks.push(k);
    marks.push(g.dist);
    h+=`<div class="note"><b>Vmesni časi</b> pri tempu ${fmtPace(rp)} /km<div class="splits">${marks.map(k=>`<div><b class="num">${fmtHMS(rp*k)}</b>${comma(k)} km</div>`).join("")}</div></div>`;
  }
  if(p.s){
    h+=`<h2 style="margin-top:18px">Koraki</h2><div class="steps">`;
    p.s.forEach(x=>{ if(x.rep){h+=`<div class="repbox"><div class="rh">Ponovi ${x.rep}×</div>${x.items.map(y=>stepHTML(y,g)).join("")}</div>`} else h+=stepHTML(x,g)});
    h+=`</div>`;
    if(p.str) h+=`<button class="btn sec" style="width:100%;margin-bottom:10px" data-g="lib">📚 Kako pravilno izvesti vaje</button>`;
  }
  if(p.t==="race") h+=`<div class="note"><b>Na startu:</b> štartna številka spredaj, čevlji in oblačila preizkušeni na generalki, ura napolnjena. Zadnji obrok 2–3 ure pred startom.</div>`;
  if(p.s) h+=`<button class="btn pri" style="width:100%;margin-bottom:10px" data-start="${d}">▶ Začni vodeni trening</button>`;
  if(p.s){const ev=calEvents(g,false).find(x=>x.d===d);if(ev)h+=`<a class="btn sec" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px" href="${gcalURL(ev)}" target="_blank" rel="noopener">📅 Dodaj v Google Koledar · ${pad(ev.st.getHours())}:${pad(ev.st.getMinutes())}</a>`}
  if(p.t!=="rest") h+=`<button class="btn ${dn?"done":"sec"}" style="width:100%" data-done="${d}">${dn?"✓ Opravljeno – tapni za razveljavitev":"Označi kot opravljeno"}</button>`;
  openSheet(h);
}

function formGoal(){return {id:"preview",name:F.name||"Moja tekma",dist:F.dist,race:F.race,start:F.start,lvl:F.lvl,dpw:F.dpw,target:parseTime(F.targetStr)}}
function formPreview(){

  if(F.race<=F.start){el.innerHTML=`<div class="err">Datum tekme mora biti po začetku priprav.</div>`;return}

  else h+=`<div class="note" style="border-color:var(--accbd)"><b style="color:var(--acct)">Odlično.</b> Dovolj časa za kakovostno pripravo (priporočeno ${pl.rec}+ tednov).</div>`;

function renderForm(){

function saveForm(){

document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);
  let el;
  if(q("[data-close]")){closeSheet();return}
  if(el=q("[data-done]")){e.stopPropagation();const g=goal(),k=g.id+"|"+el.dataset.done;const was=!!DONE[k];was?delete DONE[k]:DONE[k]=1;saveAll();renderAll();if(!was&&!LOG[k]){openLog(k);return}if(document.getElementById("ov").classList.contains("on")&&!F)openDay(el.dataset.done);return}
  if(el=q("[data-start]")){e.stopPropagation();startPlayer(el.dataset.start);return}

  if(el=q("[data-flvl]")){F.lvl=Number(el.dataset.flvl);renderForm();return}
  if(el=q("[data-fdpw]")){F.dpw=Number(el.dataset.fdpw);renderForm();return}
  if(q("[data-fsave]")){saveForm();return}

  if(el=q("[data-edit]")){PEND_DEL=null;openForm(el.dataset.edit);return}

    if(PEND_DEL!==id){PEND_DEL=id;renderGoals();return}
    GOALS=GOALS.filter(g=>g.id!==id);Object.keys(DONE).forEach(k=>{if(k.startsWith(id+"|"))delete DONE[k]});
    if(ACTIVE===id)ACTIVE=GOALS[0]?GOALS[0].id:null;PEND_DEL=null;saveAll();rebuild();renderAll();return}
  if(q("[data-newgoal]")||q("#addGoal")){openForm(null);return}
  if(q("#editBtn")){const g=goal();if(g)openForm(g.id);return}
  if(el=q("nav button")){PEND_DEL=null;show(el.dataset.v);renderGoals();return}
  if(e.target.id==="ov") closeSheet();
});

const PL={on:false};
const ICON={
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>'
};
const PREF={snd:sget("korak_snd",true),voice:sget("korak_voice",true)};
function plSteps(s){const out=[];s.forEach(x=>{if(x.rep){for(let r=1;r<=x.rep;r++)x.items.forEach(y=>out.push({k:y[0],ms:Math.round(y[1]*60000),label:y[2],r,of:x.rep}))}else out.push({k:x[0],ms:Math.round(x[1]*60000),label:x[2]})});return out}
function mmss(ms){const t=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")}
function durWords(ms){const s=Math.round(ms/1000);if(s<60)return s+" sekund";const m=Math.round(s/60);if(s%60)return mmss(ms).replace(":"," minut ")+" sekund";return m+" "+(m===1?"minuta":m===2?"minuti":m<5?"minute":"minut")}
function beep(f,d,when=0){if(!PREF.snd||!PL.ac)return;try{const ac=PL.ac,o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+when;o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+0.05)}catch(e){}}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function say(t){if(!PREF.voice)return;try{const u=new SpeechSynthesisUtterance(t);u.lang="sl-SI";u.rate=1.02;const v=speechSynthesis.getVoices().find(v=>/^sl/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
async function wake(on){try{if(on&&navigator.wakeLock&&!PL.lock)PL.lock=await navigator.wakeLock.request("screen");if(!on&&PL.lock){PL.lock.release();PL.lock=null}}catch(e){}}

function startPlayer(d,custom){
  const g=goal()||{id:"none",lvl:1,dist:10},p=custom||(PLAN&&PLAN.days.find(x=>x.d===d));if(!p||!p.s)return;
  if(typeof metroStop==="function")metroStop();
  closeSheet();
  try{PL.ac=PL.ac||new (window.AudioContext||window.webkitAudioContext)();PL.ac.resume&&PL.ac.resume()}catch(e){}
  const steps=plSteps(p.s);
  Object.assign(PL,{on:true,d,g,p,steps,idx:-1,running:true,ready:true,end:Date.now()+5000,rem:5000,active:0,last:Date.now(),lastSec:null,finished:false,confirm:false,
    totalMs:steps.reduce((a,b)=>a+b.ms,0)});
  document.getElementById("pl").classList.add("on");
  document.body.style.overflow="hidden";
  wake(true);say("Pripravi se. Začenjamo s korakom: "+K[steps[0].k].n.toLowerCase());beep(880,0.15);
  clearInterval(PL.timer);PL.timer=setInterval(plTick,200);plRender(true);
}
function plGo(i,announce){
  const P=PL;P.idx=i;P.ready=false;
  if(i>=P.steps.length){plFinish();return}
  const st=P.steps[i];P.rem=st.ms;P.end=Date.now()+st.ms;P.lastSec=null;
  if(announce){beep(990,0.12);beep(1320,0.22,0.15);buzz([120,60,120]);
    say(K[st.k].n+(st.label&&st.label.toLowerCase()!==K[st.k].n.toLowerCase()?", "+st.label:"")+". "+durWords(st.ms)+(st.r?". Ponovitev "+st.r+" od "+st.of:""));}
  plRender(true);
}
function plTick(){
  const P=PL;if(!P.on||P.finished)return;
  const now=Date.now();
  if(P.running){
    if(!P.ready)P.active+=now-P.last;
    let rem=P.end-now;
    let guard=0;
    while(rem<=0&&guard++<500){
      if(P.ready){plGo(0,true)}else{
        const over=-rem;const nxt=P.idx+1;
        if(nxt>=P.steps.length){plFinish();return}
        plGo(nxt,guard===1);P.end-=over;
      }
      if(P.finished)return;rem=P.end-now;
    }
    P.rem=rem;
    const sec=Math.ceil(rem/1000);
    if(sec<=3&&sec>=1&&sec!==P.lastSec){P.lastSec=sec;beep(660,0.1);if(sec===1)buzz(80)}
  }
  P.last=now;plRender(false);
}
function plToggle(){
  const P=PL;if(P.finished)return;
  if(P.running){P.running=false;P.rem=P.end-Date.now();say("Pavza");wake(false)}
  else{P.running=true;P.end=Date.now()+P.rem;P.last=Date.now();say("Nadaljujemo");wake(true);try{PL.ac&&PL.ac.resume()}catch(e){}}
  plRender(true);
}
function plSkip(dir){
  const P=PL;if(P.finished)return;
  let i=P.ready?(dir>0?0:0):P.idx+dir;
  if(dir<0&&!P.ready&&(P.steps[P.idx].ms-(P.end-Date.now()))>3000)i=P.idx; // nazaj = začni korak znova
  i=Math.max(0,i);
  if(i>=P.steps.length){plFinish();return}
  plGo(i,true);if(!P.running){P.rem=P.steps[i].ms}
}
function plFinish(){
  const P=PL;sset("korak_guided",sget("korak_guided",0)+1);if(!P.d)setTimeout(()=>checkBadges(true),50);P.finished=true;P.running=false;clearInterval(P.timer);wake(false);
  if(P.d){const k=P.g.id+"|"+P.d;DONE[k]=1;saveAll();renderAll();}
  beep(784,0.15);beep(988,0.15,0.18);beep(1318,0.35,0.36);buzz([200,100,200,100,400]);
  say("Trening končan. Odlično opravljeno!");
  plRender(true);
}
function plClose(){const P=PL;P.on=false;clearInterval(P.timer);wake(false);try{speechSynthesis.cancel()}catch(e){}
  document.getElementById("pl").classList.remove("on");document.body.style.overflow="";}

    ${P.d?`<button class="btn pri" style="width:100%;flex:none" data-log="${P.d}" data-min="${Math.max(1,Math.round(P.active/60000))}">📝 Vpiši, kako je šlo</button><button class="btn sec" style="width:100%;flex:none" data-pl="close">Zapri</button>`:`<button class="btn pri" style="width:100%;flex:none" data-pl="close">Zapri</button>`}</div>`;
    return;
  }
  const st=P.ready?P.steps[0]:P.steps[P.idx], dur=P.ready?5000:st.ms, rem=P.running?P.end-Date.now():P.rem;
  const frac=clamp(1-rem/dur,0,1), C=2*Math.PI*46;
  const color=P.ready?"#ffffff":K[st.k].c;
  if(full||!document.getElementById("plT")){
    document.getElementById("plGlow").style.setProperty("--kc",color);
    const nxt=P.ready?P.steps[0]:P.steps[P.idx+1];
    const tot=P.steps.map((x,i)=>`<span style="flex:${Math.max(x.ms,15000)} 0 0;background:${K[x.k].c}" class="${!P.ready&&i<P.idx?"dn":""} ${!P.ready&&i===P.idx?"cur":""}"></span>`).join("");
    const pace=!P.ready&&showPace(g)&&"ERT".includes(st.k)?`<div class="pace">≈ ${paceStr(g,st.k)}</div>`:"";

        <div class="ringw"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" stroke="var(--track)" stroke-width="5" fill="none"/>
          <circle id="plR" cx="50" cy="50" r="46" stroke="${color}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/></svg>
          <div class="tm"><b class="num" id="plT">${mmss(rem)}</b><small>${P.running?(P.ready?"start čez":"preostalo"):"PAVZA"}</small>${pace}</div></div>
        <div class="rep">${!P.ready&&st.r?`Ponovitev ${st.r} / ${st.of}`:""}</div>
        ${nxt?`<div class="nx"><i style="background:${K[nxt.k].c}"></i><div><small>Naslednje</small><b>${nxt.label}</b></div><em class="num">${fmt(nxt.ms/60000)}</em></div>`:`<div class="nx"><div><small>Naslednje</small><b>Cilj! 🏁</b></div></div>`}
      </div>
      <div class="pbar">${tot}</div>
      <div class="tot"><span>Pretečeno <b class="num" id="plA">${mmss(P.active)}</b></span><span>Preostalo <b class="num" id="plL">${mmss(plLeft())}</b></span></div>

  }

}
function plLeft(){const P=PL;if(P.ready)return P.totalMs;const rem=P.running?P.end-Date.now():P.rem;return Math.max(0,rem)+P.steps.slice(P.idx+1).reduce((a,b)=>a+b.ms,0)}
